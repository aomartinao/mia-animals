<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
  /* Same look as the animal app (index.html); only what this page uses. */
  :root {
    color-scheme: dark;
    --bg: #09090f; --card: rgba(255,255,255,.06); --card-2: rgba(255,255,255,.10);
    --ink: #f5f5fb; --muted: #a2a2bd;

    --green: #b6ff3b; --green-d: #7fbf14;
    --blue: #5cb8ff; --blue-d: #2c7fd0;
    --orange: #ffb43c; --orange-d: #cf8511;
    --purple: #a98bff; --purple-d: #7453e6;
    --red: #ff4d8d; --red-d: #c92a63;
    --ok-bg: rgba(182,255,59,.14); --ok-ink: #c9ff6a;
    --bad-bg: rgba(255,77,141,.16); --bad-ink: #ff7aa8;
    --display: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100dvh; overflow-x: hidden; background: transparent; }
  body::before { content: ""; position: fixed; inset: -25%; z-index: -1; pointer-events: none;
    background:

      radial-gradient(40% 32% at 88% 88%, rgba(14,165,233,.40), transparent 70%),
      radial-gradient(28% 22% at 85% 30%, rgba(255,77,141,.22), transparent 70%),
      radial-gradient(30% 25% at 10% 75%, rgba(182,255,59,.10), transparent 70%);

  @keyframes drift { to { transform: translate(6%, 5%) rotate(8deg) scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { body::before, .spin { animation: none; } }

  .fb-tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .srcbtn { border: 1px solid currentColor; background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 800; opacity: .85; }
  .quote { margin: 0 0 12px; padding: 10px 12px; border-left: 3px solid currentColor; border-radius: 6px; background: rgba(0,0,0,.25); color: var(--ink); font-weight: 600; font-style: italic; }

  /* End screens */
  .center { text-align: center; }

  .results { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 22px 0; }
  .res { border-radius: 20px; overflow: hidden; }
  .res .rh { color: #0b0b12; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 6px 4px; }
  .res .rv { white-space: nowrap; font-family: var(--display); font-size: 21px; font-weight: 800; padding: 12px 4px; }
  .grade { font-family: var(--display); font-size: 88px; font-weight: 800; line-height: 1; text-shadow: 0 0 40px currentColor; }
  .bych { display: grid; gap: 6px; text-align: left; margin-top: 14px; }
  .bych div { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-weight: 700; }
  .mistakes { display: grid; gap: 8px; text-align: left; margin-top: 10px; }
  .mistake { border-radius: 16px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
  .mistake b { display: block; margin-bottom: 2px; }
  .mistake .ok { color: var(--ok-ink); font-weight: 800; }

<body>
<div id="app"></div>
<script>
'use strict';
/* Zero-G study page. Private study cards (Firestore private/zero-g-2026, readable only by the
 * accounts listed in firestore.rules) drilled like the animals: lessons, Leitner boxes, a practice
 * test. No content lives in the repo. It reuses the animal app's sign-in from the same site and
 * never creates an account of its own. */

const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ } },
  del(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } },
};
// zv-* keys belong to the animal app (shared sign-in and sound setting); zg-* are this page's own.
const K = { auth: 'zv-auth-v1', sound: 'zv-sound-v1', prog: 'zg-progress-v1', course: 'zg-course-v1', timer: 'zg-timer-v1' };
const FB = { apiKey: 'AIzaSyCf2xGCpl1vmyYA0j9QVdZhL6y2nfKETgc', projectId: 'mia-animals' };
const FS = `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;
const COURSE_DOC = 'private/zero-g-2026';
const MASTER = 3;                 // box >= MASTER counts as "umím"
const LESSON_N = 12, NEW_PER_LESSON = 4, EXAM_N = 25, EXAM_SECONDS = 45;
const PRAISE = ['Výborně!', 'Super!', 'Paráda!', 'Skvělé!', 'Přesně tak!', 'Jde ti to!', 'Bezva!'];

let COURSE = null, CARDS = [], CHAPTERS = [];
let PROGRESS = store.get(K.prog, {});   // card id -> { b: box 0..5, s: seen, c: correct, w: wrong, t: last time }
let SOUND = store.get(K.sound, true);
let TIMER = store.get(K.timer, true);
let S = { screen: 'loading' };

/* ------------------------------------------------------------------ *
 *  Helpers                                                            *
 * ------------------------------------------------------------------ */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = arr => arr[Math.floor(Math.random() * arr.length)];
const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const norm = s => String(s).toLowerCase().normalize('NFC').replace(/\s+/g, ' ').trim();
// Typed answers: "2. 3. 1978" = "2.3.1978"; a trailing full stop doesn't matter.
const key = s => norm(s).replace(/\s*\.\s*/g, '.').replace(/[.,;!?]+$/, '');
const skey = s => key(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
// A number with an optional unit after it: "28 000", "28.000 km/h", "1,8 g". Null for anything else ("2. 3. 1978").
function parseNum(s) {
  const m = String(s).trim().match(/^(-?\d[\d\s  .,]*?)\s*([^\d\s.,][^\d]*)?$/);
  if (!m) return null;
  let x = m[1].replace(/[\s  ]/g, '');
  if (x.includes(',')) { x = x.replace(/\./g, '').replace(',', '.'); if (x.split('.').length > 2) return null; }   // decimal comma
  else if (/^\d{1,3}(\.\d{3})+$/.test(x)) x = x.replace(/\./g, '');                                                // 28.000 = 28000
  else if ((x.match(/\./g) || []).length > 1) return null;
  const n = Number(x);
  return Number.isFinite(n) ? n : null;
}
const fmt = x => (Math.round(x * 10) / 10).toLocaleString('cs-CZ');
const chOf = c => String(c.ch).split('.')[0];
const chTitle = id => (CHAPTERS.find(c => c.id === id) || {}).title || `Kapitola ${id}`;
const pr = c => PROGRESS[c.id] || { b: 0, s: 0, c: 0, w: 0, t: 0 };
const isKnown = c => pr(c).b >= MASTER;
const saveProgress = () => store.set(K.prog, PROGRESS);
function record(c, ok) {
  const p = PROGRESS[c.id] || (PROGRESS[c.id] = { b: 0, s: 0, c: 0, w: 0, t: 0 });
  p.s++; p.t = Date.now();
  if (ok) { p.c++; p.b = Math.min(5, p.b + 1); }
  else { p.w++; p.b = Math.max(0, p.b - 2); }

// Per card the most recently changed record wins (as in the animal app).
function mergeProg(into, P) {
  for (const [id, y] of Object.entries(P || {})) {

    if (!x || (y.t || 0) > (x.t || 0) || ((y.t || 0) === (x.t || 0) && (y.s || 0) > (x.s || 0))) into[id] = y;

}

/* Sound */
let actx = null;
function beep(ok) {
  if (!SOUND) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const now = actx.currentTime;
    (ok ? [660, 990] : [196, 147]).forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = now + i * 0.11;
      o.type = ok ? 'sine' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + 0.22);
    });
  } catch (e) { /* no audio */ }
}
function confetti(em = ['🚀', '⭐', '🛰️', '🪐', '🌍', '✨', '🎉']) {
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('div');
    s.className = 'confetti'; s.textContent = sample(em);
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = 1.8 + Math.random() * 1.8 + 's';

/* ------------------------------------------------------------------ *
 *  Firebase: the animal app's sign-in (zv-auth-v1), refreshed like    *
 *  fbToken() there, but never a new anonymous account                 *
 * ------------------------------------------------------------------ */
async function fbToken() {
  let a = store.get(K.auth, null);
  if (!a || !a.refresh) throw new Error('noauth');
  if (a.exp > Date.now() + 60e3) return a;
  const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB.apiKey}`, {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(a.refresh),
  });
  if (!r.ok) throw new Error('auth ' + r.status);
  const j = await r.json();
  a = { uid: j.user_id, id: j.id_token, refresh: j.refresh_token, exp: Date.now() + (+j.expires_in) * 1000 };
  store.set(K.auth, a); return a;
}
async function fsCall(method, path, body) {
  const a = await fbToken();
  const r = await fetch(`${FS}/${path}`, {
    method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + a.id },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) { const e = new Error('firestore ' + r.status); e.status = r.status; throw e; }
  return r.json();
}

// The course is cached for the account that loaded it, so the home-screen app also works offline.
function useCourse(data) { COURSE = data; CARDS = data.cards || []; CHAPTERS = data.chapters || []; }
async function boot() {
  const auth = store.get(K.auth, null);
  if (!auth || !auth.refresh) return go('noauth');
  const cached = store.get(K.course, null);
  if (cached && cached.uid === auth.uid && cached.data) { useCourse(cached.data); go('home'); }
  const nothing = () => { store.del(K.course); COURSE = null; CARDS = []; CHAPTERS = []; go('nothing'); };
  let doc, data;
  try { doc = await fsCall('GET', COURSE_DOC); }
  catch (e) {
    if (e.status === 401 || e.status === 403 || e.status === 404) return nothing();   // not on the list: show nothing
    if (/^(noauth|auth )/.test(e.message) && !COURSE) return go('noauth');
    if (!COURSE) go('offline');                                                       // offline without a cached copy
    return;
  }
  try { data = JSON.parse(doc.fields.data.stringValue); } catch (e) { return nothing(); }
  store.set(K.course, { uid: auth.uid, data });
  const first = !COURSE;
  useCourse(data);
  if (first) go('home'); else if (S.screen === 'home') render();
  syncProgress().then(() => { if (S.screen === 'home') render(); }).catch(() => {});
}

// progress/{uid}: { data: JSON of PROGRESS, updated: ms }. Pull, merge, then write back.
let syncTimer = null;

  const a = await fbToken();

    const d = await fsCall('GET', `progress/${a.uid}`);

  if (!Object.keys(PROGRESS).length) return;

/* ------------------------------------------------------------------ *
 *  Questions: every question is built from the card itself            *
 * ------------------------------------------------------------------ */
// Where the answer stands in the fact as a whole word (so "2" isn't found inside "2031").
function findA(c) {
  if (!c.a || !c.fact) return -1;
  for (let i = c.fact.indexOf(c.a); i >= 0; i = c.fact.indexOf(c.a, i + 1)) {
    const b = c.fact[i - 1] || ' ', e = c.fact[i + c.a.length] || ' ';
    if (!/[\p{L}\p{N}]/u.test(b) && !/[\p{L}\p{N}]/u.test(e)) return i;
  }
  return -1;
}
const words = s => String(s).trim().split(/\s+/).length;
// "why" and "think" cards work with facts rather than recall one: no fill-the-gap, no true/false.
const REASON = ['why', 'think', 'calc'];
const isReason = c => REASON.includes(c.kind);
// Typed only for short answers (a number, a date, or up to 3 words); "why" cards are never typed.
const shortA = c => c.kind !== 'why' && (c.kind === 'date' || c.kind === 'number' || parseNum(c.a) != null || words(c.a) <= 3);
function makeQ(c, level, force) {
  if (c.kind === 'calc') { const m = randInt(c.m[0], c.m[1]); return { c, type: 'calc', m, ans: +(m * c.k).toFixed(6) }; }
  const at = isReason(c) ? -1 : findA(c);
  const can = { mc: true, tf: at >= 0, cloze: at >= 0, typed: shortA(c) };
  const type = force ? (can[force] ? force : 'mc')
    : sample((level <= 1 ? ['mc', 'mc', 'tf'] : ['mc', 'cloze', 'typed', 'typed']).filter(t => can[t]));
  const q = { c, type };
  if (type === 'mc') q.options = shuffle([c.a, ...c.wrong]);
  else if (type === 'cloze') { q.before = c.fact.slice(0, at); q.after = c.fact.slice(at + c.a.length); q.options = shuffle([c.a, ...c.wrong]); }
  else if (type === 'tf') { q.truth = Math.random() < 0.5; q.stmt = q.truth ? c.fact : c.fact.slice(0, at) + sample(c.wrong) + c.fact.slice(at + c.a.length); }
  return q;
}
const promptOf = it => it.type === 'calc' ? it.c.q.replace('{m}', it.m) : it.c.q;
const rightOf = it => it.type === 'calc' ? `${fmt(it.ans)} ${it.c.unit}` : it.type === 'tf' ? (it.truth ? 'Pravda' : 'Nepravda') : it.c.a;

// Exact (or an accepted variant) = ok; accents or a one-letter slip = ½ point. Numbers ignore their format.
function checkTyped(input, c) {
  if (!String(input).trim()) return 'wrong';
  const answers = [c.a, ...(c.alt || [])];
  if (c.kind === 'name') answers.push(c.a.trim().split(/\s+/).pop());   // the surname alone
  const n = parseNum(input);
  if (n != null && answers.some(a => { const v = parseNum(a); return v != null && Math.abs(v - n) < 1e-9; })) return 'ok';
  if (answers.some(a => key(a) === key(input))) return 'ok';
  if (answers.some(a => skey(a) === skey(input))) return 'accent';
  // no typo leniency where digits matter: 1979 is not 1978
  if (answers.some(a => !/\d/.test(a) && skey(a).length > 5 && lev(skey(a), skey(input)) <= 1)) return 'typo';
  return 'wrong';
}
const calcOk = (input, it) => { const n = parseNum(input); return n != null && Math.abs(n - it.ans) <= Math.abs(it.ans) * 0.01; };

/* ------------------------------------------------------------------ *
 *  Sessions                                                           *
 * ------------------------------------------------------------------ */
const cur = () => S.L && S.L.queue[S.L.i];
function newSession(items, extra = {}) {
  return { queue: items, i: 0, done: 0, total: items.length, questions: 0, firstQs: 0, firstTry: 0, mistakes: [], seenWrong: new Set(), exam: false, ...extra };
}
// New cards in brochure order (or from one chapter), each with an intro, an easy question soon after
// and a harder one later; the rest is review, weakest and longest-unseen first.
function startLesson(ch, list) {
  const all = ch ? CARDS.filter(c => chOf(c) === ch) : CARDS;
  let items = [];
  if (list) {
    const P = [...new Set(list)];
    if (!P.length) return;
    shuffle(P).forEach(c => items.push(makeQ(c, Math.min(pr(c).b, 1))));
    while (items.length < Math.min(8, P.length * 2)) items.push(makeQ(sample(P), 2));
  } else {
    if (!all.length) return;
    const unseen = all.filter(c => !pr(c).s), seen = all.filter(c => pr(c).s);
    const fresh = unseen.slice(0, NEW_PER_LESSON);
    const now = Date.now();
    const review = seen.map(c => ({ c, s: pr(c).b * 1.3 - Math.min((now - pr(c).t) / 864e5, 7) * 0.3 + Math.random() * 1.5 }))
      .sort((x, y) => x.s - y.s).map(x => x.c);
    items = shuffle(review.slice(0, Math.max(0, LESSON_N - fresh.length * 2)).map(c => makeQ(c, pr(c).b)));
    const later = [];
    fresh.forEach((c, k) => {
      const pos = Math.min(items.length, Math.floor(k * items.length / fresh.length) + k * 2);
      items.splice(pos, 0, { c, type: 'intro' });
      items.splice(Math.min(items.length, pos + 2), 0, makeQ(c, 0));
      later.push(makeQ(c, 2));
    });
    items.push(...shuffle(later));
    const met = [...fresh, ...seen];
    while (items.filter(i => i.type !== 'intro').length < Math.min(LESSON_N, met.length * 2)) { const c = sample(met); items.push(makeQ(c, pr(c).b)); }
  }
  go('lesson', { L: newSession(items) });
}
// 25 cards spread over the chapters. About 40 % work with facts (why / think / calc), the rest recall them.
// Recall cards: about half multiple choice, a third short answers, the rest true/false.
// Reasoning cards: multiple choice, or a short answer where the answer is short.
function spread(cards, n) {
  const lists = [...new Set(cards.map(chOf))].map(id => shuffle(cards.filter(c => chOf(c) === id)));
  const out = [];
  while (out.length < n && lists.some(l => l.length)) for (const l of lists) if (l.length && out.length < n) out.push(l.pop());
  return out;
}
function startExam() {
  const reason = CARDS.filter(isReason), recall = CARDS.filter(c => !isReason(c));
  const nReason = Math.min(reason.length, Math.max(Math.round(EXAM_N * 0.4), EXAM_N - recall.length));
  const r1 = spread(reason, nReason), r2 = spread(recall, EXAM_N - r1.length);
  if (!r1.length && !r2.length) return;
  const n = r2.length, plan = [];
  for (let k = 0; k < n; k++) plan.push(k < Math.round(n * 0.35) ? 'typed' : k < Math.round(n * 0.5) ? 'tf' : 'mc');
  const types = shuffle(plan);
  const picked = [...r1, ...r2];
  const items = shuffle([...r1.map(c => makeQ(c, 2, Math.random() < 0.5 ? 'typed' : 'mc')), ...r2.map((c, k) => makeQ(c, 2, types[k]))]);
  const byCh = {};
  picked.forEach(c => { byCh[chOf(c)] = byCh[chOf(c)] || { pts: 0, n: 0 }; byCh[chOf(c)].n++; });
  go('lesson', { L: newSession(items, { exam: true, points: 0, byCh, timer: TIMER }) });
}

function answer(it, ok, extra = {}) {
  const L = S.L;
  clearTimer();
  it.state = { ok, ...extra };
  L.questions++;
  const first = !it.retry;
  if (first) L.firstQs++;
  if (ok && first) L.firstTry++;
  const miss = { c: it.c, q: promptOf(it), right: rightOf(it), answer: extra.typed };
  if (L.exam) {
    // the practice test doesn't touch the Leitner boxes
    const pts = ok ? (extra.verdict && extra.verdict !== 'ok' ? 0.5 : 1) : 0;
    L.points += pts; L.byCh[chOf(it.c)].pts += pts;
    if (pts < 1) L.mistakes.push(miss);
  } else {
    if (!ok && !L.seenWrong.has(it.c.id)) { L.seenWrong.add(it.c.id); L.mistakes.push(miss); }
    if (!ok) {
      const again = makeQ(it.c, Math.max(0, pr(it.c).b - 1));
      again.retry = true;
      L.queue.push(again); L.total++;
    }
    record(it.c, ok);
  }
  beep(ok);
  try { navigator.vibrate && navigator.vibrate(ok ? 12 : [30, 50, 30]); } catch (e) {}
  render();
}
function pick(i) {
  const it = cur();
  if (!it || it.state || it.type === 'intro') return;
  const ok = it.type === 'tf' ? (i === 0) === it.truth : it.options[i] === it.c.a;
  answer(it, ok, { pick: i });
}
function next() {
  const L = S.L;
  L.done++; L.i++;
  if (L.i >= L.queue.length) {
    go('lessonEnd', { L });
    confetti(); beep(true);
    if (!L.exam) scheduleSync(0);
    return;
  }
  render();
  window.scrollTo(0, 0);

// Practice-test timer: when it runs out, the question counts as wrong.
let timerInt = null;
function clearTimer() { clearInterval(timerInt); timerInt = null; }
function startTimer() {
  clearTimer();
  const L = S.L, it = cur();
  if (!L || !L.exam || !L.timer || !it || it.state) return;
  it.deadline = it.deadline || Date.now() + EXAM_SECONDS * 1000;
  const tick = () => {
    const left = Math.max(0, Math.ceil((it.deadline - Date.now()) / 1000));
    const el = $app.querySelector('[data-timer]');
    if (el) el.textContent = `⏱ ${left} s`;
    if (left <= 0) answer(it, false, { timeout: true, typed: '' });
  };
  tick();
  if (!it.state) timerInt = setInterval(tick, 250);
}

    <div class="bento">
      <button class="tile t-lesson hero-tile span2" data-act="lesson"><span class="go">▶ Start</span><span class="ti">🎯</span>
        <span class="tt">Pokračovat</span><span class="td">${unseen ? '12 otázek · nové karty i opakování' : '12 otázek · opakování'}</span></button>
      <button class="tile t-exam span2" data-act="examStart"><span class="ti">📝</span>
        <span class="tt">Zkušební test</span><span class="td">${Math.min(EXAM_N, total)} otázek ze všech kapitol a známka</span></button>
    </div>
    <div class="section-title"><span>Kapitoly</span><span class="small">ťukni a procvič</span></div>
    <div class="chapters">${CHAPTERS.map(ch => {
      const list = CARDS.filter(c => chOf(c) === ch.id), k = list.filter(isKnown).length;
      return `<button class="chapter" data-ch="${esc(ch.id)}"><span class="cn">${esc(ch.id)}</span>
        <span class="ct">${esc(ch.title)}<span class="cs">${k} / ${list.length} umíš</span></span>
        <i class="gbar" style="width:${list.length ? k / list.length * 100 : 0}%"></i></button>`;
    }).join('')}</div>
    <div class="foot"><button class="btn ghost small" data-act="sound">${SOUND ? '🔊 Zvuk zapnutý' : '🔇 Zvuk vypnutý'}</button></div>`;
  },

  lesson() {
    const L = S.L, it = cur();
    const top = `<div class="lesson-top"><button class="x" data-act="quit" title="Ukončit">✕</button>
      <div class="bar"><i style="width:${L.done / L.total * 100}%"></i></div>
      ${L.exam ? `${L.timer ? '<b class="small timer" data-timer></b>' : ''}<b class="small">${L.done}/${L.total}</b>` : ''}${soundBtn()}</div>`;
    if (it.type === 'intro') return top + `<span class="badge">Nová karta</span>
      <div class="intro-fact">${esc(it.c.fact)}</div>
      <div class="intro-sub">${esc(chTitle(chOf(it.c)))} · str. ${esc(it.c.page)}</div>
      <div class="spacer"></div>
      <div class="feedback neutral"><button class="btn primary wide" data-act="next" autofocus>Pokračovat</button></div>`;
    return top + questionBody(it) + (S.report ? reportModal() : '');
  },

  lessonEnd() {
    const L = S.L;
    const acc = L.firstQs ? Math.round(L.firstTry / L.firstQs * 100) : 100;
    let head;
    if (L.exam) {
      const pts = L.points, pc = pts / L.total * 100;
      const grade = pc >= 90 ? 1 : pc >= 75 ? 2 : pc >= 50 ? 3 : pc >= 30 ? 4 : 5;
      const txt = ['', 'Výborně!', 'Chválitebně', 'Dobře', 'Dostatečně', 'Ještě potrénuj'][grade];
      head = `<div class="big-emoji">📝</div><h1 style="color:var(--orange)">Test hotový!</h1>
        <div class="muted" style="font-weight:800;margin-top:12px">Známka</div>
        <div class="grade" style="color:${grade <= 2 ? 'var(--green)' : grade === 3 ? 'var(--orange)' : 'var(--red)'}">${grade}</div>
        <div style="font-weight:800">${txt} · ${pts % 1 ? pts.toFixed(1).replace('.', ',') : pts} z ${L.total} bodů · ${Math.round(pc)} %</div>
        <div class="bych">${Object.entries(L.byCh).sort(([a], [b]) => a.localeCompare(b, 'cs', { numeric: true }))
          .map(([id, v]) => `<div><span>${esc(id)}. ${esc(chTitle(id))}</span><span>${v.pts % 1 ? String(v.pts).replace('.', ',') : v.pts} / ${v.n}</span></div>`).join('')}</div>`;
    } else {
      head = `<div class="big-emoji">${acc >= 90 ? '🏆' : acc >= 60 ? '🎉' : '💪'}</div><h1 style="color:var(--orange)">Lekce hotová!</h1>
        <div class="results">
          <div class="res" style="border-color:var(--green)"><div class="rh" style="background:var(--green)">Přesnost</div><div class="rv">🎯 ${acc} %</div></div>
          <div class="res" style="border-color:var(--purple)"><div class="rh" style="background:var(--purple)">Umíš</div><div class="rv">🧠 ${CARDS.filter(isKnown).length} / ${CARDS.length}</div></div>
        </div>`;
    }
    return `<div class="center">${head}
      ${mistakesHtml(L.mistakes)}
      <div style="display:grid;gap:10px;margin-top:20px">
        ${L.mistakes.length ? '<button class="btn orange wide" data-act="practiceMistakes">Procvičit chyby</button>' : ''}
        <button class="btn primary wide" data-act="home" autofocus>Pokračovat</button>
      </div></div>`;
  },

  examStart: () => `<div class="lesson-top"><button class="x" data-act="home" title="Zpět">✕</button><h2 style="flex:1">Zkušební test</h2></div>
    <div class="glass hero">
      <p><b>${Math.min(EXAM_N, CARDS.length)} otázek</b> ze všech kapitol: výběr z možností, krátké odpovědi, pravda / nepravda a výpočty. Bez nápověd, na konci známka.</p>
      <p class="muted small">Zkušební test nemění tvůj pokrok v lekcích.</p>
    </div>
    <label class="toggle"><input type="checkbox" data-act="timer" ${TIMER ? 'checked' : ''}> ⏱ Časomíra ${EXAM_SECONDS} s na otázku</label>
    <div class="spacer"></div>
    <button class="btn primary wide" data-act="exam" autofocus>Začít test</button>`,
};

function go(screen, extra = {}) {
  S = { screen, ...extra }; render(); window.scrollTo(0, 0);
  $app.classList.remove('enter'); void $app.offsetWidth; $app.classList.add('enter');
  clearTimeout(go.t); go.t = setTimeout(() => $app.classList.remove('enter'), 700);
}
function render() {
  $app.innerHTML = SCREENS[S.screen]();
  const f = $app.querySelector('[autofocus]');
  if (f) setTimeout(() => f.focus(), 30);
  if (S.screen === 'lesson') startTimer(); else clearTimer();
}

$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-pick],[data-ch]');
  if (!b || b.disabled) return;
  if (b.dataset.pick != null) return pick(+b.dataset.pick);
  if (b.dataset.ch) return startLesson(b.dataset.ch);
  switch (b.dataset.act) {
    case 'lesson': startLesson(); break;
    case 'examStart': go('examStart'); break;
    case 'exam': startExam(); break;
    case 'timer': TIMER = b.checked; store.set(K.timer, TIMER); break;
    case 'next': next(); break;
    case 'quit': case 'home': go('home'); break;
    case 'dunno': { const it = cur(); if (it && !it.state) answer(it, false, { typed: '' }); break; }
    case 'quote': { const q = $app.querySelector('.quote'); if (q) q.hidden = !q.hidden; break; }
    case 'report': S.report = { id: cur().c.id }; render(); break;
    case 'closeReport': if (b.classList.contains('modal-bg') && e.target !== b) return; S.report = null; render(); break;
    case 'sendReport': sendReport($app.querySelector('[name=note]').value.trim()); break;
    case 'practiceMistakes': startLesson(null, S.L.mistakes.map(m => m.c)); break;
    case 'sound': SOUND = !SOUND; store.set(K.sound, SOUND); render(); break;
    case 'retry': go('loading'); boot(); break;
  }
});
$app.addEventListener('submit', e => {
  e.preventDefault();
  const it = cur();
  if (!it || it.state) return;
  const typed = e.target.ans.value.trim();
  if (!typed) return;
  if (it.type === 'calc') answer(it, calcOk(typed, it), { typed });
  else { const v = checkTyped(typed, it.c); answer(it, v !== 'wrong', { typed, verdict: v }); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || S.screen !== 'lesson' || S.report) return;
  const it = cur();
  if (it.type === 'intro' || it.state) { e.preventDefault(); next(); }
});

render();
boot();
</script>
</body>
</html>
