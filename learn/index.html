<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Zero-G</title>
<meta name="theme-color" content="#070a1c">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
  /* Same look as the animal app (index.html), in a deep-space version. */
  :root {
    color-scheme: dark;
    --bg: #070a1c; --card: rgba(255,255,255,.07); --card-2: rgba(255,255,255,.11);
    --ink: #f5f6ff; --muted: #a9adcf;
    --line: rgba(255,255,255,.13); --line-d: rgba(255,255,255,.26);
    --green: #b6ff3b; --green-d: #7fbf14;
    --blue: #5cb8ff; --blue-d: #2c7fd0;
    --orange: #ffb43c; --orange-d: #cf8511;
    --purple: #a98bff; --purple-d: #7453e6;
    --red: #ff4d8d; --red-d: #c92a63;
    --ok-bg: rgba(182,255,59,.14); --ok-ink: #c9ff6a;
    --bad-bg: rgba(255,77,141,.16); --bad-ink: #ff8ab2;
    --display: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100dvh; overflow-x: hidden; background: transparent; }
  body::before { content: ""; position: fixed; inset: -25%; z-index: -2; pointer-events: none;
    background:
      radial-gradient(38% 30% at 18% 12%, rgba(91,58,237,.55), transparent 70%),
      radial-gradient(40% 32% at 88% 88%, rgba(14,165,233,.38), transparent 70%),
      radial-gradient(28% 22% at 85% 30%, rgba(255,77,141,.20), transparent 70%),
      radial-gradient(30% 25% at 10% 75%, rgba(56,189,248,.12), transparent 70%), var(--bg);
    animation: drift 24s ease-in-out infinite alternate; }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .75;
    background-image:
      radial-gradient(1.5px 1.5px at 8% 12%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 22% 38%, #fff 50%, transparent 52%),
      radial-gradient(1.5px 1.5px at 35% 8%, #cfe3ff 50%, transparent 52%), radial-gradient(1px 1px at 48% 26%, #fff 50%, transparent 52%),
      radial-gradient(2px 2px at 63% 14%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 77% 42%, #ffe9c4 50%, transparent 52%),
      radial-gradient(1.5px 1.5px at 91% 9%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 12% 64%, #fff 50%, transparent 52%),
      radial-gradient(1.5px 1.5px at 29% 83%, #d9e6ff 50%, transparent 52%), radial-gradient(1px 1px at 54% 71%, #fff 50%, transparent 52%),
      radial-gradient(2px 2px at 70% 92%, #fff 50%, transparent 52%), radial-gradient(1px 1px at 86% 67%, #fff 50%, transparent 52%),
      radial-gradient(1px 1px at 95% 52%, #fff 50%, transparent 52%), radial-gradient(1.5px 1.5px at 42% 55%, #fff 50%, transparent 52%);
    animation: twinkle 6s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(6%, 5%) rotate(8deg) scale(1.08); } }
  @keyframes twinkle { to { opacity: .4; } }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  #app { max-width: 640px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); min-height: 100dvh; display: flex; flex-direction: column; }
  #app.enter > * { animation: rise .38s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  h1, h2, h3 { margin: 0; font-family: var(--display); letter-spacing: -.02em; }
  h1 { font-size: 30px; font-weight: 800; } h2 { font-size: 24px; font-weight: 800; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  b { font-weight: 800; }
  input[type=checkbox] { accent-color: var(--green); width: 18px; height: 18px; }
  .glass, .mistake, .modal, .res {
    background: var(--card); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }
  .btn { --edge: rgba(0,0,0,.45); border: 1px solid var(--line); background: var(--card-2); border-radius: 18px;
    padding: 14px 18px; font-weight: 800; font-size: 16px; color: var(--ink); text-decoration: none; text-align: center;
    box-shadow: 0 4px 0 var(--edge), inset 0 1px 0 rgba(255,255,255,.12);
    transition: transform .08s, box-shadow .08s, filter .15s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge), inset 0 1px 0 rgba(255,255,255,.12); }
  .btn.primary { background: linear-gradient(180deg, #d4ff7a, var(--green)); --edge: var(--green-d); color: #0b1400; border-color: transparent; }
  .btn.orange { background: linear-gradient(180deg, #ffd27a, var(--orange)); --edge: var(--orange-d); color: #2a1600; border-color: transparent; }
  .btn.blue { background: linear-gradient(180deg, #a6dcff, var(--blue)); --edge: var(--blue-d); color: #04192e; border-color: transparent; }
  .btn.purple { background: linear-gradient(180deg, #d2c2ff, var(--purple)); --edge: var(--purple-d); color: #14063a; border-color: transparent; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--blue); box-shadow: none; }
  .btn.ghost:active { transform: none; box-shadow: none; }
  .btn[disabled] { background: rgba(255,255,255,.06); color: rgba(255,255,255,.3); --edge: transparent; cursor: default; transform: none; border-color: var(--line); }
  .btn.wide { width: 100%; display: block; }
  .btn:focus, .tile:focus { outline: none; }
  .btn:focus-visible, .tile:focus-visible, .chtile:focus-visible, .act:focus-visible { outline: 2px solid rgba(255,255,255,.6); outline-offset: 3px; }

  /* Home */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
  .brand .logo { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 24px;
    background: linear-gradient(135deg, #8fd0ff, var(--purple)); box-shadow: 0 6px 20px rgba(169,139,255,.35); }
  .pillstat { display: inline-flex; gap: 5px; align-items: center; padding: 7px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 15px; font-weight: 800; text-decoration: none; }
  .testline { display: inline-block; align-self: flex-start; padding: 7px 12px; border-radius: 999px; background: rgba(92,184,255,.14); border: 1px solid rgba(92,184,255,.35); color: #a9dcff; font-weight: 800; font-size: 14px; margin-bottom: 14px; }
  .pilot { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 24px; margin-bottom: 10px;
    background: linear-gradient(135deg, rgba(92,184,255,.18), rgba(169,139,255,.16)); border: 1px solid rgba(169,139,255,.32); }
  .lvl { position: relative; flex: none; width: 62px; height: 62px; }
  .lvl svg { display: block; }
  .lvl .ln { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 24px; }
  .pilot .pt { min-width: 0; flex: 1; }
  .pilot .rank { font-family: var(--display); font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .pilot .xpline { font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 2px; }
  .xpbar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 8px; }
  .xpbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--purple), #ff7ad9); transition: width .6s; }
  .minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .mini { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); text-align: left; min-width: 0; color: var(--ink); }
  .mini .mi { font-size: 22px; line-height: 1; flex: none; }
  .mini svg { flex: none; }
  .mini b { display: block; font-family: var(--display); font-size: 18px; line-height: 1.1; }
  .mini span.ml { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini.hot { border-color: rgba(255,180,60,.5); background: rgba(255,180,60,.12); }
  .overall { margin: 2px 0 6px; }
  .ov-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .ov-num { font-family: var(--display); font-size: 36px; font-weight: 800; line-height: 1; color: var(--green); letter-spacing: -.03em; text-shadow: 0 0 24px rgba(182,255,59,.35); }
  .ov-num small { font-size: 20px; color: var(--muted); text-shadow: none; }
  .ov-label { font-weight: 800; font-size: 15px; }
  .ov-pct { margin-left: auto; font-family: var(--display); font-weight: 800; font-size: 22px; }
  .ov-bar { height: 12px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .ov-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #d4ff7a, var(--green), #3ddc84); box-shadow: 0 0 16px rgba(182,255,59,.55); transition: width .6s; }
  .bento { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .span2 { grid-column: 1 / -1; }
  .tile { position: relative; overflow: hidden; border-radius: 22px; padding: 14px; min-height: 96px; text-align: left; border: 0;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; color: #0b0b12;
    box-shadow: 0 5px 0 var(--edge, rgba(0,0,0,.4)), 0 14px 30px -12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .08s, box-shadow .08s; }
  .tile:active { transform: translateY(4px) scale(.99); box-shadow: 0 1px 0 var(--edge, rgba(0,0,0,.4)), inset 0 1px 0 rgba(255,255,255,.35); }
  .tile .ti { position: absolute; top: 8px; right: 10px; font-size: 38px; line-height: 1; transform: rotate(8deg); filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)); }
  .tile .tt { font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
  .tile .td { font-size: 12.5px; font-weight: 700; opacity: .78; max-width: 85%; }
  .tile.hero-tile { min-height: 112px; }
  .tile.hero-tile .ti { font-size: 56px; top: 12px; right: 16px; }
  .tile.hero-tile .tt { font-size: 24px; }
  .tile .go { position: absolute; left: 16px; top: 16px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: rgba(0,0,0,.18); padding: 5px 9px; border-radius: 999px; }
  .t-lesson { background: linear-gradient(135deg, #d9ff7f 0%, #9ef01a 55%, #3ddc84 100%); --edge: #5f9e10; }
  .t-exam   { background: linear-gradient(135deg, #d6c4ff, #a172ff 60%, #ff7ad9); --edge: #6a3fd1; }
  .t-book   { background: linear-gradient(135deg, #ffe6a8, #ffb43c 60%, #ff8a5c); --edge: #c46d10; }
  .section-title { font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: -.01em; margin: 24px 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .section-title .small { font-family: "Plus Jakarta Sans", sans-serif; color: var(--muted); font-weight: 700; }
  .chgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .chtile { position: relative; overflow: hidden; border: 0; border-radius: 22px; padding: 12px 12px 12px; min-height: 150px; text-align: left; color: #0b0b12;
    display: flex; flex-direction: column; gap: 6px; background: linear-gradient(150deg, var(--c1), var(--c2));
    box-shadow: 0 5px 0 var(--edge, rgba(0,0,0,.35)), 0 14px 30px -14px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.45); transition: transform .08s, box-shadow .08s; }
  .chtile:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--edge), inset 0 1px 0 rgba(255,255,255,.45); }
  .chtile .ce { font-size: 34px; line-height: 1; filter: drop-shadow(0 6px 8px rgba(0,0,0,.25)); height: 40px; display: flex; align-items: center; }
  .chtile .cnum { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: rgba(0,0,0,.14); font-family: var(--display); font-weight: 800; font-size: 18px; }
  .chtile .ring { position: absolute; top: 10px; right: 10px; }
  .chtile .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
  .chtile .ctt { font-family: var(--display); font-weight: 800; font-size: 15.5px; line-height: 1.18; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .chtile .cs { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 800; opacity: .85; }
  .chtile .cb { display: flex; gap: 2px; font-size: 14px; }
  .chtile .cb i { font-style: normal; filter: grayscale(1); opacity: .32; }
  .chtile .cb i.on { filter: none; opacity: 1; }
  .chtile .new { position: absolute; top: 22px; left: 58px; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: #0b0b12; color: #fff; padding: 3px 7px; border-radius: 999px; }
  .badgestrip { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); width: 100%; text-align: left; color: var(--ink); }
  .badgestrip .bs { flex: 1; display: flex; gap: 4px; font-size: 22px; overflow: hidden; white-space: nowrap; }
  .badgestrip .bs .none { font-size: 14px; color: var(--muted); font-weight: 700; }
  .badgestrip b { white-space: nowrap; }
  .foot { margin-top: auto; padding-top: 26px; text-align: center; }

  /* Chapter */
  .lesson-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .x { border: none; background: var(--card); width: 40px; height: 40px; border-radius: 14px; font-size: 18px; color: var(--muted); line-height: 1; flex: none; }
  .ch-hero { position: relative; border-radius: 28px; padding: 18px; color: #0b0b12; background: linear-gradient(150deg, var(--c1), var(--c2)); overflow: hidden;
    box-shadow: 0 18px 40px -18px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.5); }
  .ch-hero .ce { font-size: 54px; line-height: 1; filter: drop-shadow(0 8px 10px rgba(0,0,0,.25)); }
  .ch-hero h1 { font-size: 26px; line-height: 1.12; margin: 10px 0 6px; padding-right: 64px; }
  .ch-hero .ring { position: absolute; top: 16px; right: 16px; }
  .ch-hero .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 800; }
  .ch-hero .meta { font-weight: 800; font-size: 14px; opacity: .8; }
  .ch-hero .hb { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .ch-hero .hb span { font-size: 12px; font-weight: 800; padding: 5px 9px; border-radius: 999px; background: rgba(0,0,0,.12); }
  .ch-hero .hb span.on { background: #0b0b12; color: #fff; }
  .acts { display: grid; gap: 10px; margin-top: 16px; }
  .act { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; text-align: left; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); box-shadow: 0 4px 0 rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s; }
  .act:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .act[disabled] { opacity: .45; }
  .act .ai { flex: none; width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-size: 24px; background: var(--ac, rgba(255,255,255,.1)); }
  .act .at { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .act .at b { font-size: 17px; }
  .act .at small { font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 2px; }
  .act .tag { flex: none; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 4px 8px; border-radius: 999px; background: var(--orange); color: #2a1600; }
  .act .tag.done { background: rgba(182,255,59,.18); color: var(--ok-ink); }
  .subtitle { font-weight: 800; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 14px 2px 0; }

  /* Lesson */
  .bar { flex: 1; height: 14px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), #3ddc84); border-radius: 99px; transition: width .4s; box-shadow: 0 0 12px rgba(182,255,59,.5); }
  .timer { color: var(--orange); white-space: nowrap; }
  .combo { flex: none; font-weight: 800; font-size: 14px; padding: 6px 10px; border-radius: 999px; background: linear-gradient(90deg, #ffb43c, #ff6a3d); color: #2a0e00; white-space: nowrap; }
  .combo.bump { animation: bump .45s cubic-bezier(.2,1.8,.4,1); }
  @keyframes bump { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
  .q-title { font-family: var(--display); font-size: 23px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 14px; line-height: 1.2; }
  .badge { align-self: flex-start; display: inline-block; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #14063a;
    background: linear-gradient(90deg, #c7b3ff, #ff9ad9); border-radius: 999px; padding: 6px 12px; margin-bottom: 14px; }
  .intro-fact { font-family: var(--display); font-size: 25px; font-weight: 800; letter-spacing: -.01em; line-height: 1.25; }
  .intro-sub { color: var(--muted); font-weight: 700; margin-top: 10px; }
  .stmt { font-size: 19px; font-weight: 700; line-height: 1.4; padding: 18px; border-radius: 22px; }
  .stmt u { display: inline-block; min-width: 90px; border-bottom: 3px dashed var(--line-d); text-decoration: none; color: var(--green); }
  .options { display: grid; gap: 10px; margin-top: 16px; }
  .options.tf { grid-template-columns: 1fr 1fr; }
  .opt { text-align: left; font-weight: 800; font-size: 17px; padding: 16px 18px; }
  .options.tf .opt { text-align: center; }
  .opt.correct, .chip.correct, .pg.correct { border-color: var(--green) !important; background: var(--ok-bg); color: var(--ok-ink); box-shadow: 0 0 0 2px var(--green), 0 0 24px rgba(182,255,59,.35); }
  .opt.wrong, .chip.wrong, .pg.wrong { border-color: var(--red) !important; background: var(--bad-bg); color: var(--bad-ink); box-shadow: 0 0 0 2px var(--red); animation: shake .35s; }
  .opt[disabled], .chip[disabled] { color: var(--ink); background: var(--card-2); cursor: default; transform: none; }
  .opt.correct[disabled], .chip.correct[disabled] { color: var(--ok-ink); background: var(--ok-bg); }
  .opt.wrong[disabled], .chip.wrong[disabled] { color: var(--bad-ink); background: var(--bad-bg); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
  .chip { font-weight: 800; font-size: 16px; padding: 12px 16px; border-radius: 999px; }
  .picgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .pg { position: relative; padding: 0; border: 2px solid var(--line); border-radius: 20px; overflow: hidden; aspect-ratio: 1; background: rgba(255,255,255,.06); box-shadow: 0 4px 0 rgba(0,0,0,.4); transition: transform .08s; }
  .pg:active { transform: translateY(3px); }
  .pg img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .pg[disabled] { cursor: default; }
  .pg[disabled]:not(.correct):not(.wrong) img { opacity: .45; }
  .pg.correct::after, .pg.wrong::after { position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 800; }
  .pg.correct::after { content: "✓"; background: var(--green); color: #0b1400; }
  .pg.wrong::after { content: "✕"; background: var(--red); color: #fff; }
  .typerow { display: flex; align-items: center; gap: 10px; }
  .typein { width: 100%; font: inherit; font-size: 20px; font-weight: 700; padding: 16px 18px; border-radius: 18px; border: 1px solid var(--line-d);
    background: rgba(255,255,255,.06); color: var(--ink); margin-top: 16px; outline: none; transition: border-color .2s, box-shadow .2s; }
  .typein:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(182,255,59,.15); }
  .typein::placeholder { color: rgba(255,255,255,.35); }
  .unit { margin-top: 16px; font-weight: 800; font-size: 20px; }
  textarea.typein { font-size: 16px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .spacer { flex: 1; min-height: 12px; }
  .feedback { position: sticky; bottom: 0; margin: 16px -16px calc(-28px - env(safe-area-inset-bottom)); padding: 18px 16px calc(22px + env(safe-area-inset-bottom));
    border-radius: 28px 28px 0 0; -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); animation: sheet .28s cubic-bezier(.2,.8,.2,1); }

  const full = ok && (!extra.verdict || extra.verdict === 'ok');

    <p class="muted" style="font-weight:700">Tahle stránka používá přihlášení z Poznávačky.</p><a class="btn primary wide" href="../">Otevřít aplikaci</a></div>`,
  nothing: () => `<div class="center msg"><div class="big-emoji">🌑</div><h2>Tady nic není</h2><p></p><a class="btn wide" href="../">Zpět do aplikace</a></div>`,
  offline: () => `<div class="center msg"><div class="big-emoji">📡</div><h2>Nepodařilo se načíst</h2>
    <p class="muted" style="font-weight:700">Zkontroluj internet a zkus to znovu.</p><button class="btn primary wide" data-act="retry">Zkusit znovu</button></div>`,

  home() {
    const total = CARDS.length, known = CARDS.filter(isKnown).length, pct = total ? known / total : 0;
    const unseen = CARDS.some(c => !pr(c).s);
    const earned = badgeDefs().filter(b => STATS.badges[b.id]);
    return `
    <div class="top"><div class="brand"><span class="logo">🚀</span>Zero-G</div><a class="pillstat" href="../">🦊 Zvířata</a></div>
    ${COURSE.test ? `<div class="testline">${testLine()}</div>` : ''}
    ${pilotHtml()}
    <div class="overall">
      <div class="ov-head"><span class="ov-num">${known}<small> / ${total}</small></span><span class="ov-label">karet umíš</span><span class="ov-pct">${Math.round(pct * 100)} %</span></div>
      <div class="ov-bar"><i style="width:${Math.max(pct * 100, known ? 2 : 0)}%"></i></div>
    </div>
    <div class="bento">
      <button class="tile t-lesson hero-tile span2" data-act="lesson"><span class="go">▶ Start</span><span class="ti">🎯</span>
        <span class="tt">Pokračovat</span><span class="td">${unseen ? 'Lekce · nové karty i opakování' : 'Lekce · opakování'}</span></button>
      <button class="tile t-exam ${hasBrochure() ? '' : 'span2'}" data-act="examStart"><span class="ti">📝</span>
        <span class="tt">Zkušební test</span><span class="td">${Math.min(EXAM_N, total)} otázek a známka</span></button>
      ${hasBrochure() ? `<button class="tile t-book" data-act="reader"><span class="ti">📖</span><span class="tt">Brožura</span><span class="td">${pageList().length ? `${pageList().length} stran` : 'PDF ke stažení'}</span></button>` : ''}
    </div>
    <div class="section-title"><span>Kapitoly</span><span class="small">ťukni a vyber</span></div>
    <div class="chgrid">${CHAPTERS.map(chTile).join('')}</div>
    <div class="section-title"><span>Odznaky</span></div>
    <button class="badgestrip" data-act="badges"><span class="bs">${earned.length ? earned.slice(-9).reverse().map(b => `<span title="${esc(badgeLabel(b))}">${b.e}</span>`).join('') : '<span class="none">Zatím žádný – první získáš po lekci.</span>'}</span><b>${earned.length} / ${badgeDefs().length} ›</b></button>
    <div class="foot"><button class="btn ghost small" data-act="sound">${SOUND ? '🔊 Zvuk zapnutý' : '🔇 Zvuk vypnutý'}</button></div>`;
  },

  chapter() {
    const ch = chapter(S.ch);
    if (!ch) return SCREENS.home();
    const list = chCards(ch.id), k = list.filter(isKnown).length, met = list.filter(c => pr(c).s).length, pct = list.length ? k / list.length : 0;
    const story = storyOf(ch.id), games = chGames(ch.id), seen = !!STATS.seen[ch.id];
    const hb = [story.length && ['story', '🎬 Příběh'], list.length && ['met', '🃏 Všechny karty'], list.length && ['chal', '🏆 Zkouška']].filter(Boolean);
    const unseenN = list.length - met;
    return `<div class="lesson-top"><button class="x" data-act="home" aria-label="Zpět">←</button><b class="small muted" style="flex:1">Kapitola ${esc(ch.id)}</b>${soundBtn()}</div>
      <div class="ch-hero" style="${palStyle(ch.id)}">
        <span class="ring">${ring(pct, 58, 7, '#0b0b12', 'rgba(0,0,0,.14)')}<b>${Math.round(pct * 100)}%</b></span>
        <div class="ce">${esc(ch.emoji || '🚀')}</div><h1>${esc(ch.title)}</h1>
        <div class="meta">${k} / ${list.length} karet umíš · ${met} potkaných</div>
        <div class="hb">${hb.map(([t, l]) => `<span class="${STATS.badges[t + '-' + ch.id] ? 'on' : ''}">${l}</span>`).join('')}</div>
      </div>
      <div class="acts">
        ${story.length ? `<button class="act" data-act="story" style="--ac:rgba(255,122,217,.22)"><span class="ai">▶️</span><span class="at"><b>Příběh</b><small>${story.length} ${plural(story.length, 'obrazovka', 'obrazovky', 'obrazovek')} · obrázky a pokusy</small></span>${seen ? '<span class="tag done">viděno ✓</span>' : '<span class="tag">nové</span>'}</button>` : ''}
        <button class="act" data-act="chLesson" ${list.length ? '' : 'disabled'} style="--ac:rgba(182,255,59,.2)"><span class="ai">🎯</span><span class="at"><b>Lekce</b><small>${unseenN ? `${Math.min(unseenN, NEW_PER_LESSON)} nových karet a opakování` : 'opakování karet z kapitoly'}</small></span></button>
        ${games.map(g => `<button class="act" data-game="${esc(g.id)}" style="--ac:rgba(92,184,255,.22)"><span class="ai">🎮</span><span class="at"><b>${esc(g.title || 'Hra')}</b><small>${g.type === 'match' ? 'Hra · spoj dvojice' : 'Hra · seřaď podle pořadí'}</small></span></button>`).join('')}
        ${hasBrochure() && pageList().length ? `<button class="act" data-act="chReader" style="--ac:rgba(255,180,60,.22)"><span class="ai">📖</span><span class="at"><b>Brožura</b><small>${Array.isArray(ch.pages) && ch.pages.length ? `od str. ${esc(ch.pages[0])}` : 'celý text'}</small></span></button>` : ''}
        <button class="act" data-act="chalStart" ${list.length ? '' : 'disabled'} style="--ac:rgba(169,139,255,.24)"><span class="ai">🏆</span><span class="at"><b>Zkouška kapitoly</b><small>${Math.min(CHAL_N, list.length)} otázek · ${Math.round(CHAL_PASS * 100)} % = odznak</small></span>${STATS.badges['chal-' + ch.id] ? '<span class="tag done">splněno ✓</span>' : ''}</button>
      </div>`;
  },

  suggest() {
    const ch = chapter(S.ch);
    return `<div class="center msg"><div class="big-emoji">🎬</div><h2>Nejdřív krátký příběh?</h2>
      <p class="muted" style="font-weight:700;line-height:1.45">${esc(ch.emoji || '')} ${esc(ch.title)}: obrázky a pokusy, ze kterých hned pochopíš, o čem karty jsou. Za pár minut je to hotové.</p>
      <div style="display:grid;gap:10px;margin-top:20px"><button class="btn primary wide" data-act="watchStory" autofocus>▶️ Pustit příběh</button>
      <button class="btn wide" data-act="skipStory">Rovnou na lekci</button></div></div>`;
  },

  story() {
    const ch = chapter(S.ch), sl = storyOf(S.ch), s = sl[S.k] || {};
    const last = S.k === sl.length - 1;
    const media = s.widget ? widgetHtml(s.widget) : s.video ? videoHtml(s.video) : s.img ? pic(s.img) : '';
    const visualFirst = !s.widget;
    const words = `<h2>${esc(s.title || '')}</h2>${s.text ? `<p class="st-text">${md(s.text)}</p>` : ''}`;
    return `<div class="story" data-slide="${S.k}">
      <div class="st-top"><div class="st-dots">${sl.map((_, j) => `<i class="${j < S.k ? 'done' : j === S.k ? 'on' : ''}"></i>`).join('')}</div><button class="x" data-act="storyClose" aria-label="Zavřít">✕</button></div>
      <div class="st-slide ${S.dir || ''}">
        <div class="st-kicker">${esc(ch.emoji || '🎬')} ${esc(ch.title)} · ${S.k + 1} / ${sl.length}</div>
        ${visualFirst ? media + words : words + media}
        ${s.page != null && pageList().length ? `<button class="srcbtn st-page" data-act="readPage" data-page="${esc(s.page)}" style="color:var(--blue);margin-top:8px">📖 str. ${esc(s.page)}</button>` : ''}
      </div>
      <div class="st-nav"><button class="btn" data-act="storyPrev" ${S.k ? '' : 'disabled'} aria-label="Zpět">←</button>
        <button class="btn primary" data-act="storyNext">${last ? (STATS.seen[S.ch] ? 'Hotovo ✓' : 'Hotovo ✓ +30 XP') : 'Dál →'}</button></div>
    </div>`;
  },

  lesson() {
    const L = S.L, it = cur();
    const top = `<div class="lesson-top"><button class="x" data-act="quit" title="Ukončit">✕</button>
      <div class="bar"><i style="width:${L.done / L.total * 100}%"></i></div>
      ${L.combo >= 2 ? `<span class="combo ${it.state && it.state.ok ? 'bump' : ''}" data-combo="${L.combo}">🔥 ${L.combo}</span>` : ''}
      ${L.exam ? `${L.timer ? '<b class="small timer" data-timer></b>' : ''}<b class="small">${L.done}/${L.total}</b>` : ''}${soundBtn()}</div>`;
    if (it.type === 'intro') return top + `<span class="badge">Nová karta</span>
      ${pic(it.c.img)}
      <div class="intro-fact">${esc(it.c.fact)}</div>
      <div class="intro-sub">${esc(chTitle(chOf(it.c)))} · str. ${esc(it.c.page)}</div>
      <div class="spacer"></div>
      <div class="feedback neutral"><button class="btn primary wide" data-act="next" autofocus>Pokračovat</button></div>`;
    return top + questionBody(it) + (S.report ? reportModal() : '');
  },

  lessonEnd() {
    const L = S.L;
    const acc = L.firstQs ? Math.round(L.firstTry / L.firstQs * 100) : 100;
    let head;
    if (L.exam && L.chal) {
      const pc = Math.round((L.pc || 0) * 100), pass = (L.pc || 0) >= CHAL_PASS;
      head = `<div class="big-emoji">${pass ? '🏆' : '💪'}</div><h1 style="color:${pass ? 'var(--green)' : 'var(--orange)'}">${pass ? 'Zkouška splněná!' : 'Ještě kousek'}</h1>
        <div class="muted" style="font-weight:800;margin-top:8px">${esc(chTitle(L.chal))}</div>
        <div class="grade" data-chal="${pc}" style="font-size:72px;margin-top:10px;color:${pass ? 'var(--green)' : 'var(--orange)'}">${pc} %</div>
        <div style="font-weight:800">${fmt(L.points)} z ${L.total} bodů · na odznak je potřeba ${Math.round(CHAL_PASS * 100)} %</div>`;
    } else if (L.exam) {
      const pts = L.points, pc = pts / L.total * 100;
      const grade = pc >= 90 ? 1 : pc >= 75 ? 2 : pc >= 50 ? 3 : pc >= 30 ? 4 : 5;
      const txt = ['', 'Výborně!', 'Chválitebně', 'Dobře', 'Dostatečně', 'Ještě potrénuj'][grade];
      head = `<div class="big-emoji">📝</div><h1 style="color:var(--orange)">Test hotový!</h1>
        <div class="muted" style="font-weight:800;margin-top:12px">Známka</div>
        <div class="grade" style="color:${grade <= 2 ? 'var(--green)' : grade === 3 ? 'var(--orange)' : 'var(--red)'}">${grade}</div>
        <div style="font-weight:800">${txt} · ${pts % 1 ? pts.toFixed(1).replace('.', ',') : pts} z ${L.total} bodů · ${Math.round(pc)} %</div>
        <div class="bych">${Object.entries(L.byCh).filter(([, v]) => v.n > 0).sort(([a], [b]) => a.localeCompare(b, 'cs', { numeric: true }))
          .map(([id, v]) => `<div><span>${esc(id)}. ${esc(chTitle(id))}</span><span>${v.pts % 1 ? String(v.pts).replace('.', ',') : v.pts} / ${v.n}</span></div>`).join('')}</div>`;
    } else {
      head = `<div class="big-emoji">${acc >= 90 ? '🏆' : acc >= 60 ? '🎉' : '💪'}</div><h1 style="color:var(--orange)">${acc >= 90 ? 'Bezchybná mise!' : acc >= 60 ? 'Lekce hotová!' : 'Hotovo, dobrá práce!'}</h1>`;
    }
    const results = `<div class="results">
        <div class="res" style="border-color:var(--orange)"><div class="rh" style="background:var(--orange)">Získáno</div><div class="rv" data-xp="${L.xp}">⭐ +${L.xp} XP</div></div>
        <div class="res" style="border-color:#ff6a3d"><div class="rh" style="background:#ff8a5c">Nejdelší série</div><div class="rv">🔥 ${L.bestCombo}</div></div>
        ${L.exam ? '' : `<div class="res" style="border-color:var(--green)"><div class="rh" style="background:var(--green)">Přesnost</div><div class="rv">🎯 ${acc} %</div></div>
        <div class="res" style="border-color:var(--purple)"><div class="rh" style="background:var(--purple)">Umíš</div><div class="rv">🧠 ${CARDS.filter(isKnown).length} / ${CARDS.length}</div></div>`}
      </div>`;
    const defs = badgeDefs();
    const gains = [
      L.levelUp && `<div class="gain"><span class="gi">${rankOf(L.levelUp)[1]}</span><span>Úroveň ${L.levelUp}: ${esc(rankOf(L.levelUp)[0])}<small>Nová hodnost!</small></span></div>`,
      ...(L.badges || []).map(id => defs.find(b => b.id === id)).filter(Boolean).map(b => `<div class="gain" data-badge="${esc(b.id)}"><span class="gi">${b.e}</span><span>${esc(b.ch ? b.n : b.t)}<small>${b.ch ? esc(chTitle(b.ch)) : 'Nový odznak'}</small></span></div>`),
    ].filter(Boolean).join('');
    const ch = L.nextCh, chObj = ch && chapter(ch);
    const offer = L.offer && GAMES.find(g => g.id === L.offer);
    const nexts = [
      L.mistakes.length && '<button class="btn orange wide" data-act="practiceMistakes">Procvičit chyby</button>',
      L.chal ? `<button class="btn primary wide" data-act="chalAgain" ${(L.pc || 0) >= CHAL_PASS ? '' : 'autofocus'}>🏆 Zkusit znovu</button>` : !L.exam && `<button class="btn primary wide" data-act="again" autofocus>🎯 Další lekce</button>`,
      offer && `<button class="btn blue wide" data-game="${esc(offer.id)}">🎮 Bonusová hra: ${esc(offer.title || '')}</button>`,
      chObj && storyOf(ch).length && !STATS.seen[ch] && `<button class="btn purple wide" data-act="storyOf" data-chs="${esc(ch)}">▶️ Příběh: ${esc(chObj.title)}</button>`,
      `<button class="btn wide" data-act="home" ${L.exam && !L.chal ? 'autofocus' : ''}>Domů</button>`,
    ].filter(Boolean).join('');
    return `<div class="center">${head}${results}
      ${gains ? `<div class="gains">${gains}</div>` : ''}
      ${mistakesHtml(L.mistakes)}
      <div class="next-title">Co dál?</div>
      <div style="display:grid;gap:10px">${nexts}</div></div>`;
  },

  examStart() {
    const ch = S.ch && chapter(S.ch);
    const n = ch ? Math.min(CHAL_N, chCards(ch.id).length) : Math.min(EXAM_N, CARDS.length);
    return `<div class="lesson-top"><button class="x" data-act="${ch ? 'back' : 'home'}" title="Zpět">✕</button><h2 style="flex:1">${ch ? 'Zkouška kapitoly' : 'Zkušební test'}</h2></div>
    <div class="glass hero">
      ${ch ? `<p><b>${esc(ch.emoji || '')} ${esc(ch.title)}</b></p><p><b>${n} otázek</b> z této kapitoly, jako ve zkušebním testu. Když dáš aspoň ${Math.round(CHAL_PASS * 100)} %, získáš odznak 🏆.</p>`
        : `<p><b>${n} otázek</b> ze všech kapitol: výběr z možností, krátké odpovědi, pravda / nepravda a výpočty. Bez nápověd, na konci známka.</p>`}
      <p class="muted small">${ch ? 'Zkouška' : 'Zkušební test'} nemění tvůj pokrok v lekcích.</p>
    </div>
    <label class="toggle"><input type="checkbox" data-act="timer" ${TIMER ? 'checked' : ''}> ⏱ Časomíra ${EXAM_SECONDS} s na otázku</label>
    <div class="spacer"></div>
    <button class="btn primary wide" data-act="exam" autofocus>${ch ? 'Začít zkoušku' : 'Začít test'}</button>`;
  },

  game() {
    const G = S.G, g = G.g;
    let body;
    if (g.type === 'match') {
      const cell = (side, i) => {
        const p = G.pairs[i], ok = G.ok.has(i), sel = G.sel && G.sel.side === side && G.sel.i === i;
        const bad = G.bad && G.bad[side === 'l' ? 0 : 1] === i;
        return `<button class="mb ${side} ${ok ? 'ok' : ''} ${G.just === i && ok ? 'just' : ''} ${sel ? 'sel' : ''} ${bad ? 'bad' : ''}" data-m${side}="${i}" ${ok ? 'disabled' : ''}>
          ${side === 'l' && p.img && mediaUrl(p.img) ? `<img src="${mediaUrl(p.img)}" alt="" draggable="false">` : ''}${esc(side === 'l' ? p.l : p.r)}</button>`;
      };
      body = `<p class="muted small" style="font-weight:700;margin:0 0 12px">Ťukni na jednu věc vlevo a k ní na tu pravou vpravo.</p>
        <div class="mt"><div class="col">${G.left.map(i => cell('l', i)).join('')}</div><div class="col">${G.right.map(i => cell('r', i)).join('')}</div></div>`;
    } else {
      const order = G.checked ? G.picks : G.items.map((_, k) => k);
      body = `<p class="muted small" style="font-weight:700;margin:0 0 12px">${G.checked ? 'Takhle jsi to seřadila:' : 'Ťukej postupně od prvního po poslední. Dalším ťuknutím pořadí zrušíš.'}</p>
        <div class="ol">${order.map((k, pos) => {
          const it = G.items[k], at = G.picks.indexOf(k);
          const cls = G.checked ? (G.right[pos] ? 'good' : 'miss') : at >= 0 ? 'picked' : '';
          return `<button class="ob ${cls}" data-ord="${k}" ${G.checked ? 'disabled' : ''}><span class="on">${G.checked ? pos + 1 : at >= 0 ? at + 1 : ''}</span>
            <span class="lab">${esc(it.label)}${G.checked && !G.right[pos] ? `<span class="fix">patří na ${G.place[pos]}. místo</span>` : ''}</span>${G.checked && it.show != null ? `<span class="show">${esc(it.show)}</span>` : ''}</button>`;
        }).join('')}</div>
        ${G.checked ? '' : `<button class="btn primary wide" data-act="check" style="margin-top:14px" ${G.picks.length === G.items.length ? '' : 'disabled'}>Zkontrolovat</button>`}`;
    }
    const doneHtml = G.done ? `<div class="g-done"><h3>${G.good === G.of ? '🎉 Perfektní!' : G.good >= G.of / 2 ? '👍 Dobrá práce!' : '💪 Příště líp!'}</h3>
      <p>${g.type === 'match' ? `${G.of} dvojic${G.wrong ? ` · ${G.wrong} ${plural(G.wrong, 'chyba', 'chyby', 'chyb')}` : ' bez chyby'}` : `${G.good} z ${G.of} na správném místě`} · <b>+${G.xp} XP</b></p>
      <div class="row"><button class="btn" data-act="gameBack">Zpět</button><button class="btn primary" data-act="gameAgain" autofocus>Znovu</button></div></div>` : '';
    return `<div class="lesson-top"><button class="x" data-act="gameBack" aria-label="Zpět">←</button><b class="small muted" style="flex:1">🎮 Hra · ${esc(chTitle(String(g.ch)))}</b>${soundBtn()}</div>
      <div class="g-head"><h2>${esc(g.title || 'Hra')}</h2></div>${body}${doneHtml}`;
  },

  badges() {
    const defs = badgeDefs();
    const row = b => `<div class="act" style="${STATS.badges[b.id] ? '' : 'opacity:.45'}"><span class="ai" style="${STATS.badges[b.id] ? 'background:rgba(255,180,60,.25)' : 'filter:grayscale(1)'}">${b.e}</span><span class="at"><b>${esc(b.ch ? b.n : b.t)}</b>${b.ch ? `<small>${esc(chTitle(b.ch))}</small>` : ''}</span>${STATS.badges[b.id] ? '<span class="tag done">✓</span>' : ''}</div>`;
    return `<div class="lesson-top"><button class="x" data-act="home" aria-label="Zpět">←</button><h2 style="flex:1">Odznaky</h2></div>
      <p class="muted" style="font-weight:700;margin:0 0 6px">Máš ${defs.filter(b => STATS.badges[b.id]).length} z ${defs.length}. Nejdelší série: 🔥 ${STATS.best} · nejdelší řada dní: ${Math.max(STATS.top, streak())}</p>
      <div class="subtitle">Mise</div><div class="acts">${defs.filter(b => !b.ch).map(row).join('')}</div>
      ${CHAPTERS.filter(c => defs.some(b => b.ch === c.id)).map(c => `<div class="subtitle">${esc(c.emoji || c.id + '.')} ${esc(c.title)}</div><div class="acts">${defs.filter(b => b.ch === c.id).map(row).join('')}</div>`).join('')}`;
  },
};

function go(screen, extra = {}) {
  S = { screen, ...extra }; render(); window.scrollTo(0, 0);
  $app.classList.remove('enter'); void $app.offsetWidth; $app.classList.add('enter');
  clearTimeout(go.t); go.t = setTimeout(() => $app.classList.remove('enter'), 700);
}
function render() {
  cleanup();
  PENDING_W = [];
  $app.innerHTML = SCREENS[S.screen]();
  mountWidgets($app);
  const f = $app.querySelector('[autofocus]');
  if (f) setTimeout(() => f.focus({ preventScroll: true }), 30);
  if (S.screen === 'lesson') startTimer(); else clearTimer();
}

$app.addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]');
  if (z && !z.closest('button')) return lightbox(z.dataset.zoom);
  const b = e.target.closest('[data-act],[data-pick],[data-ch],[data-game],[data-ml],[data-mr],[data-ord]');
  if (!b || b.disabled) return;
  if (b.dataset.pick != null) return pick(+b.dataset.pick);
  if (b.dataset.ch) return go('chapter', { ch: b.dataset.ch });
  if (b.dataset.game) return startGame(b.dataset.game, S.screen === 'lessonEnd' ? { screen: 'chapter', ch: String((GAMES.find(g => g.id === b.dataset.game) || {}).ch) } : null);
  if (b.dataset.ml != null) return matchTap('l', +b.dataset.ml);
  if (b.dataset.mr != null) return matchTap('r', +b.dataset.mr);
  if (b.dataset.ord != null) return orderTap(+b.dataset.ord);
  switch (b.dataset.act) {
    case 'lesson': startLesson(); break;
    case 'examStart': go('examStart'); break;
    case 'exam': S.ch ? startChallenge(S.ch) : startExam(); break;
    case 'timer': TIMER = b.checked; store.set(K.timer, TIMER); break;
    case 'next': next(); break;
    case 'quit': S.L && S.L.ch ? go('chapter', { ch: S.L.ch }) : go('home'); break;
    case 'home': go('home'); break;
    case 'back': go('chapter', { ch: S.ch }); break;
    case 'dunno': { const it = cur(); if (it && !it.state) answer(it, false, { typed: '' }); break; }
    case 'quote': { const q = $app.querySelector('.quote'); if (q) q.hidden = !q.hidden; break; }
    case 'readPage': openReader(b.dataset.page); break;
    case 'report': S.report = { id: cur().c.id }; render(); break;
    case 'closeReport': if (b.classList.contains('modal-bg') && e.target !== b) return; S.report = null; render(); break;
    case 'sendReport': sendReport($app.querySelector('[name=note]').value.trim()); break;
    case 'practiceMistakes': startLesson(null, S.L.mistakes.map(m => m.c)); break;
    case 'again': startLesson(S.L.lch || undefined); break;
    case 'chalAgain': go('examStart', { ch: S.L.chal }); break;
    case 'sound': SOUND = !SOUND; store.set(K.sound, SOUND); render(); break;
    case 'retry': go('loading'); boot(); break;
    case 'reader': openReader(); break;
    case 'badges': go('badges'); break;
    case 'story': go('story', { ch: S.ch, k: 0, then: 'chapter' }); break;
    case 'storyOf': go('story', { ch: b.dataset.chs, k: 0, then: 'chapter' }); break;
    case 'chLesson': startLesson(S.ch); break;
    case 'chReader': { const c = chapter(S.ch); openReader(c && Array.isArray(c.pages) ? c.pages[0] : null); break; }
    case 'chalStart': go('examStart', { ch: S.ch }); break;
    case 'watchStory': go('story', { ch: S.ch, k: 0, then: 'lesson', lch: S.lch }); break;
    case 'skipStory': startLesson(S.lch || undefined, null, true); break;
    case 'storyPrev': storyNav(-1); break;
    case 'storyNext': storyNav(1); break;
    case 'storyClose': S.then === 'lesson' ? go('home') : go('chapter', { ch: S.ch }); break;
    case 'play': playVideo(b.closest('.vid')); break;
    case 'check': orderCheck(); break;
    case 'gameAgain': startGame(S.G.g.id, S.G.back); break;
    case 'gameBack': go(S.G.back.screen, S.G.back.ch ? { ch: S.G.back.ch } : {}); break;
  }
});
$app.addEventListener('submit', e => {
  e.preventDefault();
  const it = cur();
  if (!it || it.state) return;
  const typed = e.target.ans.value.trim();
  if (!typed) return;
  if (it.type === 'calc') answer(it, calcOk(typed, it), { typed });
  else { const v = checkTyped(typed, it.c); answer(it, v !== 'wrong', { typed, verdict: v }); }
});
document.addEventListener('keydown', e => {
  if (document.getElementById('lb')) { if (e.key === 'Escape') closeLightbox(); return; }
  if (RD) {
    if (e.key === 'Escape') closeReader();
    else if (e.key === 'ArrowRight') readerGo(RD.i + 1);
    else if (e.key === 'ArrowLeft') readerGo(RD.i - 1);
    return;
  }
  if (S.screen === 'story' && !e.target.closest('input')) {
    if (e.key === 'ArrowRight') storyNav(1);
    else if (e.key === 'ArrowLeft') storyNav(-1);
    else if (e.key === 'Escape') $app.querySelector('[data-act=storyClose]').click();
    return;
  }
  if (e.key !== 'Enter' || S.screen !== 'lesson' || S.report) return;
  const it = cur();
  if (it.type === 'intro' || it.state) { e.preventDefault(); next(); }
});
// Swipes: story slides and brochure pages (not while zoomed, not on a widget).
let touch0 = null;
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touch0 = e.touches.length === 1 && !e.target.closest('[data-noswipe],input') ? { x: t.clientX, y: t.clientY, at: Date.now(), el: e.target } : null;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!touch0) return;
  const t = e.changedTouches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y, el = touch0.el;
  touch0 = null;
  if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx) * 0.7) return;
  if (RD) { if (!RD.zoom && el.closest('.rd-view')) readerGo(RD.i + (dx < 0 ? 1 : -1)); return; }
  if (S.screen === 'story' && el.closest('.story')) storyNav(dx < 0 ? 1 : -1);
}, { passive: true });

render();
boot();
</script>
</body>
</html>
