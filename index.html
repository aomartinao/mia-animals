<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poznávačka zvířat</title>
<meta name="theme-color" content="#09090f">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zvířata">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/smartcrop@2.0.5/smartcrop.js" async onload="window.focusImg && document.querySelectorAll('.pic img').forEach(focusImg)"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<style>
  /* ===== Poznávačka v2: dark-first, glass + bento, tactile ===== */
  :root {
    color-scheme: dark;
    --bg: #09090f; --card: rgba(255,255,255,.06); --card-2: rgba(255,255,255,.10);
    --ink: #f5f5fb; --muted: #a2a2bd;
    --line: rgba(255,255,255,.12); --line-d: rgba(255,255,255,.24);
    --green: #b6ff3b; --green-d: #7fbf14;
    --blue: #5cb8ff; --blue-d: #2c7fd0;
    --orange: #ffb43c; --orange-d: #cf8511;
    --purple: #a98bff; --purple-d: #7453e6;
    --red: #ff4d8d; --red-d: #c92a63;
    --ok-bg: rgba(182,255,59,.14); --ok-ink: #c9ff6a;
    --bad-bg: rgba(255,77,141,.16); --bad-ink: #ff7aa8;
    --radius: 22px;
    --display: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100dvh; overflow-x: hidden; background: transparent; }
  /* animated aurora behind everything */
  body::before { content: ""; position: fixed; inset: -25%; z-index: -1; pointer-events: none;
    background:
      radial-gradient(38% 30% at 18% 12%, rgba(124,58,237,.55), transparent 70%),
      radial-gradient(40% 32% at 88% 88%, rgba(14,165,233,.40), transparent 70%),
      radial-gradient(28% 22% at 85% 30%, rgba(255,77,141,.22), transparent 70%),
      radial-gradient(30% 25% at 10% 75%, rgba(182,255,59,.10), transparent 70%);
    animation: drift 24s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(6%, 5%) rotate(8deg) scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { body::before, .spin { animation: none; } }
  button { font: inherit; color: inherit; cursor: pointer; }
  #app { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(28px + env(safe-area-inset-bottom)); min-height: 100dvh; display: flex; flex-direction: column; }
  #app.enter > * { animation: rise .38s cubic-bezier(.2,.8,.2,1) both; }
  #app.enter > *:nth-child(2) { animation-delay: .04s; } #app.enter > *:nth-child(3) { animation-delay: .08s; }
  #app.enter > *:nth-child(4) { animation-delay: .12s; } #app.enter > *:nth-child(5) { animation-delay: .16s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  h1, h2, h3 { margin: 0; font-family: var(--display); letter-spacing: -.02em; }
  h1 { font-size: 32px; font-weight: 800; } h2 { font-size: 24px; font-weight: 800; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  input[type=checkbox] { accent-color: var(--green); width: 18px; height: 18px; }

  /* glass */
  .glass, .hero, .lb-row, .mistake, .modal, .res, .warn, .acard, .tile.plain {
    background: var(--card); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }

  /* tactile buttons */
  .btn { --edge: rgba(0,0,0,.45); border: 1px solid var(--line); background: var(--card-2); border-radius: 18px;
    padding: 14px 18px; font-weight: 800; font-size: 16px; color: var(--ink);
    box-shadow: 0 4px 0 var(--edge), inset 0 1px 0 rgba(255,255,255,.12);
    transition: transform .08s, box-shadow .08s, filter .15s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge), inset 0 1px 0 rgba(255,255,255,.12); }
  .btn.primary { background: linear-gradient(180deg, #d4ff7a, var(--green)); --edge: var(--green-d); color: #0b1400; border-color: transparent; }
  .btn.blue { background: linear-gradient(180deg, #8fd0ff, var(--blue)); --edge: var(--blue-d); color: #041628; border-color: transparent; }
  .btn.orange { background: linear-gradient(180deg, #ffd27a, var(--orange)); --edge: var(--orange-d); color: #2a1600; border-color: transparent; }
  .btn.purple { background: linear-gradient(180deg, #c7b3ff, var(--purple)); --edge: var(--purple-d); color: #14063a; border-color: transparent; }
  .btn.red { background: linear-gradient(180deg, #ff86b3, var(--red)); --edge: var(--red-d); color: #2b0012; border-color: transparent; }
  .btn.gold { background: linear-gradient(180deg, #ffe680, #ffc62e); --edge: #c48f00; color: #2b1d00; border-color: transparent; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--blue); box-shadow: none; }
  .btn.ghost:active { transform: none; box-shadow: none; }
  .btn[disabled] { background: rgba(255,255,255,.06); color: rgba(255,255,255,.3); --edge: transparent; cursor: default; transform: none; border-color: var(--line); }
  .btn.wide { width: 100%; }
  .btn:focus, .tile:focus { outline: none; }
  .btn:focus-visible, .tile:focus-visible { outline: 2px solid rgba(255,255,255,.6); outline-offset: 3px; }

  /* ===== Home ===== */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
  .brand .logo { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 24px;
    background: linear-gradient(135deg, var(--green), #3ddc84); box-shadow: 0 6px 20px rgba(182,255,59,.35); }
  .stats { display: flex; gap: 8px; font-weight: 800; }
  .pillstat { display: inline-flex; gap: 5px; align-items: center; padding: 7px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 15px; }
  .bento { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .span2 { grid-column: 1 / -1; }
  .tile { position: relative; overflow: hidden; border-radius: 26px; padding: 16px; min-height: 128px; text-align: left; border: 0;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; color: #0b0b12;
    box-shadow: 0 5px 0 var(--edge, rgba(0,0,0,.4)), 0 14px 30px -12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .08s, box-shadow .08s; }
  .tile:active { transform: translateY(4px) scale(.99); box-shadow: 0 1px 0 var(--edge, rgba(0,0,0,.4)), inset 0 1px 0 rgba(255,255,255,.35); }
  .tile[disabled] { filter: grayscale(.8) brightness(.6); }
  .tile .ti { position: absolute; top: 10px; right: 12px; font-size: 52px; line-height: 1; transform: rotate(8deg);
    filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)); transition: transform .3s; }
  .tile:hover .ti { transform: rotate(-4deg) scale(1.08); }
  .tile .tt { font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: -.02em; }
  .tile .td { font-size: 12.5px; font-weight: 700; opacity: .75; max-width: 85%; }
  .tile.hero-tile { min-height: 150px; }
  .tile.hero-tile .ti { font-size: 76px; top: 14px; right: 18px; }
  .tile.hero-tile .tt { font-size: 28px; }
  .tile .go { position: absolute; left: 16px; top: 16px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    background: rgba(0,0,0,.18); padding: 5px 9px; border-radius: 999px; }
  .t-lesson { background: linear-gradient(135deg, #d9ff7f 0%, #9ef01a 55%, #3ddc84 100%); --edge: #5f9e10; }
  .t-cards  { background: linear-gradient(135deg, #9fe0ff, #4f9dff); --edge: #2a66c2; }
  .t-atlas  { background: linear-gradient(135deg, #ffe08a, #ff9f43); --edge: #c46a12; }
  .t-exam   { background: linear-gradient(135deg, #d6c4ff, #a172ff 60%, #ff7ad9); --edge: #6a3fd1; }
  .t-board  { background: linear-gradient(135deg, #fff1a6, #ffc62e); --edge: #b98600; }
  .t-duels  { background: linear-gradient(135deg, #ffa3c7, #ff4d8d); --edge: #b8235a; }
  .progress-card { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 26px; margin-bottom: 12px; }
  .ring { width: 84px; height: 84px; flex: none; position: relative; }
  .ring svg { transform: rotate(-90deg); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 20px; }
  .progress-card .pt { font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .hero { border-radius: 26px; padding: 16px; margin-bottom: 16px; }
  .bar { height: 12px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), #3ddc84); border-radius: 99px; transition: width .4s; box-shadow: 0 0 12px rgba(182,255,59,.5); }
  .bar.thin { height: 6px; }
  .section-title { font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: -.01em; margin: 22px 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .section-title .small { font-family: "Plus Jakarta Sans", sans-serif; color: var(--muted); font-weight: 700; }
  .groups { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 10px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .groups::-webkit-scrollbar { display: none; }
  .group { background: rgba(255,255,255,.07); border: 1px solid var(--line); flex: none; width: 132px; scroll-snap-align: start; text-align: left; border-radius: 20px; padding: 12px; color: var(--ink); opacity: .55; transition: opacity .2s, transform .1s, border-color .2s; }
  .group.on { opacity: 1; border-color: var(--gc, var(--green)); box-shadow: 0 0 0 1px var(--gc, var(--green)), 0 8px 24px -10px var(--gc, var(--green)); }
  .group:active { transform: scale(.97); }
  .group .gname { font-weight: 800; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .group .gname .gi { font-size: 28px; }
  .group .gcount { font-size: 12px; color: var(--muted); margin: 4px 0 8px; font-weight: 700; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .foot { margin-top: auto; padding-top: 26px; text-align: center; }

  /* ===== Lesson ===== */
  .lesson-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .x { border: none; background: var(--card); width: 40px; height: 40px; border-radius: 14px; font-size: 18px; color: var(--muted); line-height: 1; flex: none; }
  .lesson-top .bar { flex: 1; height: 14px; }
  .q-title { font-family: var(--display); font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 14px; }
  .pic { width: 100%; aspect-ratio: 4 / 3; border-radius: 26px; overflow: hidden; background: rgba(255,255,255,.05); position: relative;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 40px -20px rgba(0,0,0,.8), 0 0 0 1px var(--line); }
  .pic img { width: 100%; height: 100%; object-fit: cover; background: rgba(255,255,255,.04); }
  .pic.whole img { object-fit: contain; }
  .pic .fallback { font-size: 64px; }
  .pic.sm { aspect-ratio: 1 / 1; }
  .options { display: grid; gap: 10px; margin-top: 16px; }
  .opt { text-align: left; font-weight: 800; font-size: 18px; padding: 16px 18px; }
  .opt.correct, .chip.correct { border-color: var(--green) !important; background: var(--ok-bg); color: var(--ok-ink); box-shadow: 0 0 0 2px var(--green), 0 0 24px rgba(182,255,59,.35); }
  .opt.wrong, .chip.wrong { border-color: var(--red) !important; background: var(--bad-bg); color: var(--bad-ink); box-shadow: 0 0 0 2px var(--red); animation: shake .35s; }
  .opt[disabled], .chip[disabled], .imgopt[disabled] { color: var(--ink); background: var(--card-2); cursor: default; transform: none; }
  .opt.correct[disabled], .chip.correct[disabled] { color: var(--ok-ink); background: var(--ok-bg); }
  .opt.wrong[disabled], .chip.wrong[disabled] { color: var(--bad-ink); background: var(--bad-bg); }
  .imgopts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .imgopt { padding: 5px; border-radius: 24px; }
  .imgopt .pic { border-radius: 19px; aspect-ratio: 1 / 1; box-shadow: none; }
  .imgopt.correct { box-shadow: 0 0 0 3px var(--green), 0 0 28px rgba(182,255,59,.45); background: var(--ok-bg); }
  .imgopt.wrong { box-shadow: 0 0 0 3px var(--red); background: var(--bad-bg); animation: shake .35s; }
  .blank { font-family: var(--display); font-size: 28px; font-weight: 800; margin-top: 18px; text-align: center; }
  .blank u { display: inline-block; min-width: 120px; border-bottom: 3px dashed var(--line-d); text-decoration: none; color: var(--green); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
  .chip { font-weight: 800; font-size: 18px; padding: 12px 18px; border-radius: 999px; }
  .typein { width: 100%; font: inherit; font-size: 20px; font-weight: 700; padding: 16px 18px; border-radius: 18px; border: 1px solid var(--line-d);
    background: rgba(255,255,255,.06); color: var(--ink); margin-top: 16px; outline: none; transition: border-color .2s, box-shadow .2s; }
  .typein:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(182,255,59,.15); }
  .typein::placeholder { color: rgba(255,255,255,.35); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .spacer { flex: 1; min-height: 12px; }
  .intro-name { font-family: var(--display); font-size: 34px; font-weight: 800; letter-spacing: -.02em; text-align: center; margin-top: 18px; }
  .intro-sub { text-align: center; color: var(--muted); font-style: italic; margin-top: 4px; }
  .speak { border: none; background: rgba(92,184,255,.18); color: var(--blue); border-radius: 12px; font-size: 18px; padding: 6px 10px; vertical-align: middle; margin-left: 6px; }
  .badge { align-self: flex-start; display: inline-block; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #14063a;
    background: linear-gradient(90deg, #c7b3ff, #ff9ad9); border-radius: 999px; padding: 6px 12px; margin-bottom: 10px; }

  .feedback { position: sticky; bottom: 0; margin: 16px -16px calc(-28px - env(safe-area-inset-bottom)); padding: 18px 16px calc(22px + env(safe-area-inset-bottom));
    border-radius: 28px 28px 0 0; -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); animation: sheet .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes sheet { from { transform: translateY(40%); opacity: 0; } }
  .feedback.ok { background: rgba(40,60,10,.85); color: var(--ok-ink); border-top: 1px solid rgba(182,255,59,.4); }
  .feedback.bad { background: rgba(70,10,35,.85); color: var(--bad-ink); border-top: 1px solid rgba(255,77,141,.4); }
  .feedback.neutral { background: rgba(9,9,15,.7); border-top: 1px solid var(--line); animation: none; }
  .feedback h3 { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
  .feedback p { margin: 0 0 14px; font-weight: 700; }
  .feedback .btn.primary.bad { background: linear-gradient(180deg, #ff86b3, var(--red)); --edge: var(--red-d); color: #2b0012; }

  /* ===== End screens ===== */
  .center { text-align: center; }
  .big-emoji { font-size: 88px; line-height: 1; margin: 20px 0 12px; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  .results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 22px 0; }
  .res { border-radius: 20px; overflow: hidden; border-color: var(--line) !important; }
  .res .rh { color: #0b0b12; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 6px 4px; }
  .res .rv { white-space: nowrap; font-family: var(--display); font-size: 21px; font-weight: 800; padding: 12px 4px; }
  .grade { font-family: var(--display); font-size: 88px; font-weight: 800; line-height: 1; text-shadow: 0 0 40px currentColor; }
  .mistakes { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; text-align: left; margin-top: 10px; }
  .mistake { border-radius: 20px; overflow: hidden; }
  .mistake .pic { border-radius: 0; aspect-ratio: 1/1; box-shadow: none; }
  .mistake div.t { padding: 8px 10px; font-size: 13px; }
  .mistake b { display: block; font-size: 14px; }
  .mistake s { color: var(--bad-ink); }

  /* ===== Atlas ===== */
  .atlas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .acard { padding: 0; overflow: hidden; text-align: left; border-radius: 22px; --edge: rgba(0,0,0,.5); }
  .acard .pic { border-radius: 0; aspect-ratio: 1/1; box-shadow: none; }
  .acard .an { padding: 10px 12px 12px; font-weight: 800; font-size: 14px; }
  .dots { display: flex; gap: 3px; margin-top: 6px; }
  .dots i { width: 14px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); }
  .dots i.on { background: var(--green); box-shadow: 0 0 6px rgba(182,255,59,.6); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
  .sticky-head { position: sticky; top: 0; z-index: 5; padding: 10px 16px; margin: -16px -16px 0;
    background: rgba(9,9,15,.75); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: rgba(24,24,36,.92); border-radius: 28px; padding: 14px; width: 100%; max-width: 520px; max-height: 92dvh; overflow: auto; animation: pop .25s; }

  .flash .pic { cursor: pointer; }
  .reveal { min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .loading { margin: auto; text-align: center; }
  .spin { font-size: 64px; animation: bob 1s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-12px) rotate(8deg); } }
  .shake { animation: shake .35s; }
  @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-8px);} 75% { transform: translateX(8px);} }
  .pop { animation: pop .3s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { 0% { transform: scale(.94); opacity: .3; } 100% { transform: scale(1); opacity: 1; } }
  .confetti { position: fixed; top: -20px; font-size: 26px; pointer-events: none; z-index: 100; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  .warn { border-color: rgba(255,180,60,.4) !important; color: #ffd08a; border-radius: 18px; padding: 12px 14px; font-weight: 700; font-size: 14px; margin-bottom: 12px; }
  .credit { font-size: 11px; color: rgba(255,255,255,.35); margin-top: 8px; text-align: right; }
  .credit a { color: inherit; }

  /* ===== Leaderboard / duels ===== */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 14px; padding: 4px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
  .tab { padding: 10px; font-weight: 800; border: 0; background: transparent; box-shadow: none; border-radius: 14px; color: var(--muted); }
  .tab:active { transform: none; box-shadow: none; }
  .tab.on { background: var(--ink); color: #0b0b12; }
  .lb { display: grid; gap: 8px; }
  .lb-row { display: flex; align-items: center; gap: 12px; border-radius: 18px; padding: 12px 14px; font-weight: 800; }
  .lb-row.me { border-color: var(--green); box-shadow: 0 0 0 1px var(--green), 0 0 24px -6px rgba(182,255,59,.5); }
  .lb.ranked .lb-row:nth-child(1) { background: linear-gradient(90deg, rgba(255,198,46,.28), rgba(255,255,255,.05)); border-color: rgba(255,198,46,.55); }
  .lb.ranked .lb-row:nth-child(2) { background: linear-gradient(90deg, rgba(210,220,235,.2), rgba(255,255,255,.05)); }
  .lb.ranked .lb-row:nth-child(3) { background: linear-gradient(90deg, rgba(222,140,80,.22), rgba(255,255,255,.05)); }
  .lb.ranked .lb-row:nth-child(-n+3) .lb-rank { font-size: 26px; }
  .lb-rank { width: 34px; text-align: center; font-size: 17px; color: var(--muted); font-family: var(--display); }
  .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-val { color: var(--orange); font-family: var(--display); }
  .duel-card { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; }
  .duel-card .dn { flex: 1; }

const ANIMALS = RAW.trim().split('\n').map(line => {
  const [g, cz, la] = line.split('|').map(s => s.trim());
  const sp = cz.indexOf(' ');
  return { id: cz, g, cz, la, first: cz.slice(0, sp), second: cz.slice(sp + 1) };

const GROUP_BY_ID = Object.fromEntries(GROUPS.map(g => [g.id, g]));

/* ------------------------------------------------------------------ *
 *  Storage (every access guarded; the app works without it)           *
 * ------------------------------------------------------------------ */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ } },
  del(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } },
};
const K = { prog: 'zv-progress-v1', stats: 'zv-stats-v1', sel: 'zv-selected-v1', imgs: 'zv-images-v6', bad: 'zv-badimg-v1', sound: 'zv-sound-v1', hide: 'zv-hide-v1', focus: 'zv-focus-v1', whole: 'zv-whole-v1', auth: 'zv-auth-v1', player: 'zv-player-v1', duels: 'zv-duels-v1', onboarded: 'zv-onboarded-v1' };

let PROGRESS = store.get(K.prog, {});   // id -> { b: box 0..5, s: seen, c: correct, w: wrong, t: last time }
let STATS = store.get(K.stats, { xp: 0, streak: 0, lastDay: null, lessons: 0 });
let SELECTED = store.get(K.sel, GROUPS.map(g => g.id));
let BAD = new Set(store.get(K.bad, []));
let SOUND = store.get(K.sound, true);
let IMAGES = {};                        // id -> [url, ...]
let IMG_STATE = 'loading';              // loading | ok | failed

const MASTER = 3;                       // box >= MASTER counts as "umím"
const prog = a => PROGRESS[a.id] || (PROGRESS[a.id] = { b: 0, s: 0, c: 0, w: 0, t: 0 });
const saveProgress = () => store.set(K.prog, PROGRESS);
function record(a, correct) {
  const p = prog(a);
  p.s++; p.t = Date.now();
  if (correct) { p.c++; p.b = Math.min(5, p.b + 1); }
  else { p.w++; p.b = Math.max(0, p.b - 2); }
  saveProgress();
}

/* ------------------------------------------------------------------ *
 *  Photos from Wikipedia (CORS enabled via origin=*), cached locally  *
 * ------------------------------------------------------------------ */
async function wikiThumbs(host, titles) {
  const out = {};
  for (let i = 0; i < titles.length; i += 50) {
    const chunk = titles.slice(i, i + 50);
    const url = `https://${host}/w/api.php?action=query&format=json&formatversion=2&origin=*` +
      `&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=640&pilimit=50&titles=` +
      encodeURIComponent(chunk.join('|'));
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const q = (await res.json()).query || {};
    const final = {};
    chunk.forEach(t => { final[t] = t; });
    const follow = list => (list || []).forEach(n => {
      for (const k in final) if (final[k] === n.from) final[k] = n.to;
    });
    follow(q.normalized);
    follow(q.redirects);
    const byTitle = {};
    (q.pages || []).forEach(p => { if (p.thumbnail && p.thumbnail.source) byTitle[p.title] = p.thumbnail.source; });
    chunk.forEach(t => { if (byTitle[final[t]]) out[t] = byTitle[final[t]]; });
  }
  return out;
}

const fileKey = url => { const parts = url.split(/[?#]/)[0].split('/'); return decodeURIComponent(/px-/.test(parts[parts.length - 1]) ? parts[parts.length - 2] : parts[parts.length - 1]); };

const MAX_PHOTOS = 5;
async function loadImages(force) {
  const cached = store.get(K.imgs, null);
  const fresh = cached && Date.now() - cached.t < 14 * 864e5 && cached.v === ANIMALS.length;
  if (cached && fresh && !force) { IMAGES = cached.data; IMG_STATE = 'ok'; return; }
  try {
    // Czech Wikipedia by Latin name first: a Czech name can redirect to a different
    // species (e.g. "Vlk mořský" -> European seabass instead of Anarhichas lupus)
    // More Wikipedias by Latin name = more (usually different) lead photos per animal
    const extra = ['de', 'fr', 'it', 'es', 'pl', 'nl'];
    const [en, csLa, csCz, ...others] = await Promise.all([
      wikiThumbs('en.wikipedia.org', ANIMALS.map(a => a.la)).catch(() => ({})),
      wikiThumbs('cs.wikipedia.org', ANIMALS.map(a => a.la)).catch(() => ({})),
      wikiThumbs('cs.wikipedia.org', ANIMALS.map(a => a.cz)).catch(() => ({})),
      ...extra.map(l => wikiThumbs(l + '.wikipedia.org', ANIMALS.map(a => a.la)).catch(() => ({}))),
    ]);
    const data = {};
    ANIMALS.forEach(a => {
      const list = [];
      [en[a.la], csLa[a.la] || csCz[a.cz], ...others.map(o => o[a.la])].forEach(u => {
        if (u && list.length < MAX_PHOTOS && !isMapImage(u) && !list.some(x => fileKey(x) === fileKey(u))) list.push(u);
      });
      if (list.length) data[a.id] = list;
    });
    if (Object.keys(data).length === 0) throw new Error('no images');
    IMAGES = data; IMG_STATE = 'ok';
    store.set(K.imgs, { t: Date.now(), v: ANIMALS.length, data });
  } catch (e) {
    if (cached) { IMAGES = cached.data; IMG_STATE = 'ok'; }
    else IMG_STATE = 'failed';
  }
}
// Wikipedia sometimes leads with a range map or globe instead of a photo
const MAP_RE = /(^|[^a-z])(map|mapa|karte|range|distribution|distrib|rozsireni|areal|verbreitung|locator|location|globe|world|earth|orthographic)([^a-z]|$)|\.svg|verbreitung|karte|location|seawifs|biosphere|global|hemisphere|distribution|rozsireni/i;
// Photos checked by hand and found wrong (file names on Wikimedia Commons)
const BLOCKED_FILES = new Set([
  'Anglerfish_Range_Map.svg',        // ďas mořský: range map
  'Clupeaharengusdistkils.jpg',      // sleď obecný: distribution map
  'LocationSolomonIslands.png',      // scink šalomounský: locator map
  'Human.svg',                       // člověk rozumný: drawing
]);
const isMapImage = u => BLOCKED_FILES.has(fileKey(u)) || MAP_RE.test(fileKey(u).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/_/g, ' '));
const imgsOf = a => (IMAGES[a.id] || []).filter(u => !BAD.has(u) && !isMapImage(u));
const hasImg = a => imgsOf(a).length > 0;
const pickImg = a => { const l = imgsOf(a); return l.length ? l[Math.floor(Math.random() * l.length)] : null; };
function preload(urls) { urls.forEach(u => { if (u) { const i = new Image(); i.src = u; } }); }

/* ------------------------------------------------------------------ *
 *  Helpers                                                            *
 * ------------------------------------------------------------------ */
const $app = document.getElementById('app');
// Photo mode for every picture: smart crop (default) or whole photo on a blurred backdrop
let WHOLE = store.get(K.whole, false);
document.body.classList.toggle('whole-photos', WHOLE);
const EXPAND_ICON = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v7M9 5l3-3 3 3M12 22v-7M9 19l3 3 3-3M2 12h7M5 9l-3 3 3 3M22 12h-7M19 9l3 3-3 3"/></svg>';
const photoLabel = () => WHOLE ? '✂️ Ořez' : EXPAND_ICON + ' Celé';
const photoBtn = () => `<button class="photo-mode" data-act="photoMode" title="Přepnout ořez / celé fotky">${photoLabel()}</button>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = arr => arr[Math.floor(Math.random() * arr.length)];
const uniqBy = (arr, f) => { const seen = new Set(); return arr.filter(x => { const k = f(x); if (seen.has(k)) return false; seen.add(k); return true; }); };
const norm = s => s.toLowerCase().normalize('NFC').replace(/\s+/g, ' ').trim();
const strip = s => norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function checkTyped(input, a) {
  if (norm(input) === norm(a.cz)) return 'ok';
  if (strip(input) === strip(a.cz)) return 'accent';
  if (strip(a.cz).length > 5 && lev(strip(input), strip(a.cz)) <= 1) return 'typo';
  return 'wrong';
}
const pool = () => ANIMALS.filter(a => SELECTED.includes(a.g));
const imgPool = () => pool().filter(hasImg);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
function bumpStreak() {
  const t = today(), y = new Date(Date.now() - 864e5);
  const yd = `${y.getFullYear()}-${y.getMonth() + 1}-${y.getDate()}`;
  if (STATS.lastDay !== t) { STATS.streak = STATS.lastDay === yd ? STATS.streak + 1 : 1; STATS.lastDay = t; }
  STATS.lessons++;
  store.set(K.stats, STATS);
}
function currentStreak() {
  const y = new Date(Date.now() - 864e5);
  const yd = `${y.getFullYear()}-${y.getMonth() + 1}-${y.getDate()}`;
  return (STATS.lastDay === today() || STATS.lastDay === yd) ? STATS.streak : 0;
}

/* Sound + speech */
let actx = null;
function beep(ok) {
  if (!SOUND) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const now = actx.currentTime;
    (ok ? [660, 990] : [196, 147]).forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = now + i * 0.11;
      o.type = ok ? 'sine' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + 0.22);
    });
  } catch (e) { /* no audio */ }
}

/* Smart framing: crop each photo to the frame around its most detailed
 * region (usually the animal), instead of the plain centre. */
const FOCUS = store.get(K.focus, {});
let focusSave = null;
// Big photos (questions, intro, cards, Atlas detail) take the photo's own
// shape within limits; beyond them (eels, snakes) the whole animal is shown
// on a blurred copy of the photo instead of being cropped.
const FRAME_MIN = 0.8, FRAME_MAX = 1.9;
function fitMainFrame(img, frame) {
  if (frame.closest('.acard, .mistake, .imgopt') || frame.classList.contains('sm') || frame.classList.contains('slide')) return;
  const r = img.naturalWidth / img.naturalHeight;
  frame.style.aspectRatio = String(Math.min(FRAME_MAX, Math.max(FRAME_MIN, r)));
  if (r > FRAME_MAX * 1.08 || r < FRAME_MIN / 1.08) {
    frame.classList.add('fit');
    frame.style.setProperty('--pic', `url("${img.src.replace(/"/g, '%22')}")`);
  }
}
function focusImg(img) {
  const frame = img.parentElement;
  if (!frame || !img.naturalWidth) return;
  fitMainFrame(img, frame);
  if (frame.classList.contains('whole') || frame.classList.contains('fit')) return;
  const fw = frame.clientWidth, fh = frame.clientHeight;
  if (!fw || !fh) return;
  const key = img.src + '|' + (fw / fh).toFixed(2);
  if (FOCUS[key]) { img.style.objectPosition = FOCUS[key]; return; }
  if (!window.smartcrop || img.dataset.nocors) return;
  const W = img.naturalWidth, H = img.naturalHeight;
  try {
    smartcrop.crop(img, { width: fw, height: fh, skinWeight: 0.6 }).then(r => {
      const c = r.topCrop;
      const px = W > c.width + 1 ? c.x / (W - c.width) * 100 : 50;
      const py = H > c.height + 1 ? c.y / (H - c.height) * 100 : 50;
      const pos = `${Math.round(px)}% ${Math.round(py)}%`;
      FOCUS[key] = pos;
      img.style.objectPosition = pos;
      clearTimeout(focusSave);
      focusSave = setTimeout(() => store.set(K.focus, FOCUS), 500);
    }).catch(() => {});
  } catch (e) { /* canvas blocked: keep centre */ }
}
function imgError(img, icon) {
  if (img.hasAttribute('crossorigin')) {
    // server didn't allow CORS: show the photo anyway, just without smart framing
    img.removeAttribute('crossorigin'); img.dataset.nocors = '1'; img.src = img.src;
    return;
  }
  img.replaceWith(Object.assign(document.createElement('span'), { className: 'fallback', textContent: icon }));
}
const speakBtn = a => EGG && a.id === CHIMP

function dots(a) { const b = prog(a).b; return `<div class="dots">${[1, 2, 3, 4, 5].map(i => `<i class="${b >= i ? 'on' : ''}"></i>`).join('')}</div>`; }

/* ------------------------------------------------------------------ *
 *  Distractors                                                        *
 * ------------------------------------------------------------------ */
function distractors(a, n, { needImg = false, hard = false } = {}) {
  const others = ANIMALS.filter(x => x !== a && (!needImg || hasImg(x)));
  const sameGenus = shuffle(others.filter(x => x.first === a.first));
  const sameGroup = shuffle(others.filter(x => x.g === a.g && x.first !== a.first));
  const rest = shuffle(others.filter(x => x.g !== a.g));
  const order = hard ? [...sameGenus, ...sameGroup, ...rest] : [...sameGroup.slice(0, 2), ...sameGenus, ...sameGroup.slice(2), ...rest];
  return uniqBy(order, x => x.id).slice(0, n);
}
function epithetOptions(a) {
  const ending = a.second.slice(-1);
  const all = uniqBy(ANIMALS, x => x.second).map(x => x.second).filter(s => s !== a.second);
  const sameGenus = ANIMALS.filter(x => x.first === a.first && x.second !== a.second).map(x => x.second);
  const sameEnd = shuffle(all.filter(s => s.slice(-1) === ending));
  const picks = uniqBy([...shuffle(sameGenus), ...sameEnd, ...shuffle(all)], s => s).slice(0, 3);
  return shuffle([a.second, ...picks]);
}

/* ------------------------------------------------------------------ *
 *  Question factory                                                   *
 * ------------------------------------------------------------------ */
function makeQuestion(a, level) {
  let types;
  if (level <= 0) types = ['pickName', 'pickName', 'pickImage'];
  else if (level === 1) types = ['pickName', 'pickImage', 'epithet'];
  else if (level === 2) types = ['epithet', 'pickNameHard', 'type', 'pickImage'];
  else types = ['type', 'type', 'epithet', 'pickNameHard'];
  let type = sample(types);
  const q = { a, type, img: pickImg(a) };
  if (type === 'pickName' || type === 'pickNameHard') {
    q.options = shuffle([a, ...distractors(a, 3, { hard: type === 'pickNameHard' })]);
    q.type = 'pickName';
  } else if (type === 'pickImage') {
    const ds = distractors(a, 3, { needImg: true });
    if (ds.length < 3) return { a, type: 'pickName', img: q.img, options: shuffle([a, ...distractors(a, 3)]) };
    q.options = shuffle([a, ...ds]).map(x => ({ a: x, img: x === a ? q.img : pickImg(x) }));
  } else if (type === 'epithet') {
    q.options = epithetOptions(a);
  }
  return q;
}

function startLesson(fromList) {
  const P = fromList || imgPool();
  if (!P.length) { alert('Nejsou k dispozici žádné obrázky. Zkontroluj připojení k internetu.'); return; }
  const N = Math.min(12, Math.max(P.length, 4));
  let items = [];
  if (fromList) {
    shuffle(P).slice(0, N).forEach(a => items.push(makeQuestion(a, Math.min(prog(a).b, 1))));
    while (items.length < Math.min(8, P.length * 2)) items.push(makeQuestion(sample(P), 2));
  } else {
    const unseen = shuffle(P.filter(a => !prog(a).s));
    const seen = P.filter(a => prog(a).s);
    const newCount = Math.min(unseen.length, seen.length < 6 ? 4 : 2);
    const fresh = unseen.slice(0, newCount);
    // weakest + longest-unseen animals first, with a little randomness
    const now = Date.now();
    const review = seen.map(a => {
      const p = prog(a), ageDays = (now - p.t) / 864e5;
      return { a, score: p.b * 1.3 - Math.min(ageDays, 7) * 0.3 + Math.random() * 1.5 };
    }).sort((x, y) => x.score - y.score).map(x => x.a);
    const reviewCount = Math.max(0, N - newCount * 2);
    const rev = review.slice(0, reviewCount);
    rev.forEach(a => items.push(makeQuestion(a, prog(a).b)));
    items = shuffle(items);
    // each new animal: intro card, a quick easy question soon after, a harder one later
    fresh.forEach((a, k) => {
      const pos = Math.min(items.length, Math.floor(k * items.length / fresh.length) + k * 3);
      items.splice(pos, 0, { a, type: 'intro', img: pickImg(a) });
      items.splice(Math.min(items.length, pos + 2), 0, makeQuestion(a, 0));
      items.splice(Math.min(items.length, pos + 6), 0, makeQuestion(a, 1));
    });
    while (items.filter(i => i.type !== 'intro').length < Math.min(N, P.length * 2)) {
      const a = sample(P); items.push(makeQuestion(a, prog(a).b));
    }
  }
  const L = { queue: items, i: 0, done: 0, total: items.length, questions: 0, firstQs: 0, firstTry: 0, xp: 0, mistakes: [], seenWrong: new Set(), exam: false };
  preload(items.flatMap(it => [it.img, ...(it.type === 'pickImage' ? it.options.map(o => o.img) : [])]));
  go('lesson', { L });
  maybeSpeakIntro();
}

function startExam() {
  const P = shuffle(imgPool());
  if (!P.length) { alert('Nejsou k dispozici žádné obrázky. Zkontroluj připojení k internetu.'); return; }
  const items = P.map(a => ({ a, type: 'type', img: pickImg(a) }));
  const L = { queue: items, i: 0, done: 0, total: items.length, questions: 0, firstQs: 0, firstTry: 0, xp: 0, mistakes: [], seenWrong: new Set(), exam: true, points: 0 };
  preload(items.slice(0, 10).map(i => i.img));
  go('lesson', { L });
}

function startCards() {
  const P = imgPool();
  if (!P.length) { alert('Nejsou k dispozici žádné obrázky. Zkontroluj připojení k internetu.'); return; }
  const queue = P.map(a => ({ a, s: prog(a).b + Math.random() * 2 })).sort((x, y) => x.s - y.s).slice(0, 15).map(x => x.a);
  const C = { queue: shuffle(queue), i: 0, flipped: false, yes: 0 };
  C.img = pickImg(C.queue[0]);
  preload(C.queue.map(a => imgsOf(a)[0]));
  go('cards', { C });
}

function maybeSpeakIntro() {
  const it = S.L && S.L.queue[S.L.i];
  if (it && it.type === 'intro') setTimeout(() => say(it.a.cz), 250);
}

function answer(it, ok, extra) {
  const L = S.L;
  it.state = { ok, ...extra };
  L.questions++;
  const firstTime = !it.retry;
  if (firstTime) L.firstQs++;
  if (ok && firstTime) L.firstTry++;
  if (L.duel) {
    L.duel.ms += Date.now() - (it.shownAt || Date.now());
    if (ok) L.duel.score++;
  } else if (L.exam) {
    L.points += ok ? (extra.verdict === 'ok' ? 1 : 0.5) : 0;
    if (!ok || extra.verdict !== 'ok') L.mistakes.push({ a: it.a, img: it.img, answer: extra.typed || '—' });
  } else {
    if (!ok && !L.seenWrong.has(it.a.id)) { L.seenWrong.add(it.a.id); L.mistakes.push({ a: it.a, img: it.img }); }
    if (!ok) {
      // Duolingo style: the question comes back later in the lesson
      const again = makeQuestion(it.a, Math.max(0, prog(it.a).b - 1));
      again.retry = true;
      L.queue.push(again); L.total++;
    }
  }
  if (ok) L.xp += firstTime ? 2 : 1;
  record(it.a, ok);
  beep(ok);
  try { navigator.vibrate && navigator.vibrate(ok ? 12 : [30, 50, 30]); } catch (e) {}
  if (ok) say(it.a.cz);
  render();
}

function next() {
  EGG = false;
  const L = S.L;
  L.done++; L.i++;
  if (L.i >= L.queue.length) {
    L.xp += L.exam ? 5 : 10;
    addXp(L.xp);
    bumpStreak();
    if (L.duel) { finishDuel(L); return; }
    go('lessonEnd', { L });
    confetti(); beep(true);
    return;
  }
  render();
  window.scrollTo(0, 0);
  maybeSpeakIntro();
}

function isoWeek(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear();
  const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
  return `${y}-W${String(w).padStart(2, '0')}`;
}
function weekXp() { return STATS.wk === isoWeek() ? (STATS.wxp || 0) : 0; }
function addXp(n) {
  const wk = isoWeek();
  if (STATS.wk !== wk) { STATS.wk = wk; STATS.wxp = 0; }
  STATS.xp += n; STATS.wxp = (STATS.wxp || 0) + n;

}

async function fbToken() {
  let a = store.get(K.auth, null);
  if (a && a.exp > Date.now() + 60e3) return a;
  let r, j;
  if (a && a.refresh) {
    r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB.apiKey}`, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(a.refresh),
    });
    if (r.ok) {
      j = await r.json();
      a = { uid: j.user_id, id: j.id_token, refresh: j.refresh_token, exp: Date.now() + (+j.expires_in) * 1000 };
      store.set(K.auth, a); return a;
    }
  }
  r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB.apiKey}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnSecureToken: true }),
  });
  if (!r.ok) throw new Error('auth ' + r.status);
  j = await r.json();
  a = { uid: j.localId, id: j.idToken, refresh: j.refreshToken, exp: Date.now() + (+j.expiresIn) * 1000 };
  store.set(K.auth, a); return a;
}
const fsVal = v => typeof v === 'string' ? { stringValue: v } : Number.isInteger(v) ? { integerValue: String(v) } : { timestampValue: v.toISOString() };
const fsDoc = obj => ({ fields: Object.fromEntries(Object.entries(obj).map(([k, v]) => [k, fsVal(v)])) });
const fsRead = f => Object.fromEntries(Object.entries(f || {}).map(([k, v]) => [k, v.stringValue ?? (v.integerValue != null ? +v.integerValue : v.timestampValue)]));
async function fsCall(method, path, body) {
  const a = await fbToken();
  const r = await fetch(path.startsWith(':') ? FS + path : `${FS}/${path}`, {
    method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + a.id },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error(`firestore ${r.status}`);
  return r.status === 204 ? null : r.json();
}

let syncTimer = null;
function scheduleSync() { if (!PLAYER) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncPlayer().catch(() => {}), 1500); }
async function syncPlayer() {
  if (!PLAYER) return;

  await Promise.all([
    fsCall('PATCH', `players/${a.uid}`, fsDoc({ name: PLAYER.name, known: knownCount(), xp: Math.min(STATS.xp, 1e6), updated: now })),
    fsCall('PATCH', `weeks/${isoWeek()}/players/${a.uid}`, fsDoc({ name: PLAYER.name, xp: Math.min(weekXp(), WEEK_CAP), updated: now })),

}
async function fetchBoard(tab) {

    structuredQuery: { from: [{ collectionId: 'players' }], orderBy: [{ field: { fieldPath: field }, direction: 'DESCENDING' }], limit: 100 },
  });
  return (rows || []).filter(r => r.document).map(r => ({ uid: r.document.name.split('/').pop(), ...fsRead(r.document.fields) }))
    .sort((x, y) => (y[field] - x[field]) || ((y.xp || 0) - (x.xp || 0)));
}

    if (after && after.startsWith('duel:')) { openDuel(after.slice(5)); return; }
    loadBoard();
  } catch (e) {
    PLAYER = store.get(K.player, null);
    S.B.error = /403/.test(e.message) ? NICK_REFUSED : 'Nepovedlo se připojit. Zkontroluj internet.'; render();
  }
}
async function leaveBoard() {
  if (!confirm('Opravdu odejít ze žebříčku? Tvoje jméno a body z něj zmizí.')) return;
  try {
    const a = await fbToken();
    await Promise.all([fsCall('DELETE', `players/${a.uid}`), fsCall('DELETE', `weeks/${isoWeek()}/players/${a.uid}`)]);
    PLAYER = null; store.del(K.player); go('home');
  } catch (e) { alert('Nepovedlo se, zkus to znovu.'); }
}

/* ------------------------------------------------------------------ *
 *  Duels: play 10 animals, send a link, friends get exactly the same   *
 *  questions and photos. Ranking: most correct, then fastest.          *
 *  duels/{id} holds the questions; duels/{id}/results/{uid} one try.   *
 * ------------------------------------------------------------------ */
const DUEL_N = 10;
const findAnimal = id => ANIMALS.find(a => a.id === id);
const fmtTime = ms => (ms / 1000).toFixed(1).replace('.', ',') + ' s';
const randId = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => 'abcdefghijkmnopqrstuvwxyz23456789'[b % 33]).join('');
function myDuels() { return store.get(K.duels, []); }
function rememberDuel(d) { store.set(K.duels, [d, ...myDuels().filter(x => x.id !== d.id)].slice(0, 15)); }

function duelQuestions() {
  const P = shuffle(imgPool()).slice(0, DUEL_N);
  return P.map(a => {
    let q; do { q = makeQuestion(a, 2); } while (q.type === 'type');
    if (q.type === 'pickName') return { a: a.id, t: 'pickName', img: q.img, o: q.options.map(x => x.id) };
    if (q.type === 'epithet') return { a: a.id, t: 'epithet', img: q.img, o: q.options };
    return { a: a.id, t: 'pickImage', img: q.img, o: q.options.map(x => ({ a: x.a.id, img: x.img })) };
  });
}
function duelItems(qs) {
  return qs.map(q => {
    const a = findAnimal(q.a); if (!a) return null;
    if (q.t === 'pickName') return { a, type: 'pickName', img: q.img, options: q.o.map(findAnimal).filter(Boolean) };
    if (q.t === 'epithet') return { a, type: 'epithet', img: q.img, options: q.o };
    return { a, type: 'pickImage', img: q.img, options: q.o.map(x => ({ a: findAnimal(x.a), img: x.img })).filter(x => x.a) };
  }).filter(Boolean);
}
function startDuelGame(duel) {
  const items = duelItems(duel.qs);
  const L = { queue: items, i: 0, done: 0, total: items.length, questions: 0, firstQs: 0, firstTry: 0, xp: 0, mistakes: [], seenWrong: new Set(), exam: false,
    duel: { ...duel, score: 0, ms: 0 } };
  preload(items.flatMap(it => [it.img, ...(it.type === 'pickImage' ? it.options.map(o => o.img) : [])]));
  go('lesson', { L });
}
function newDuel() {
  if (!PLAYER) { go('board', { B: { tab: 'week', after: 'duels' } }); return; }
  if (imgPool().length < DUEL_N) { alert(`Vyber skupiny s aspoň ${DUEL_N} zvířaty.`); return; }
  startDuelGame({ id: randId(), create: true, qs: duelQuestions(), byName: PLAYER.name });
}
async function finishDuel(L) {
  const d = L.duel;
  go('duel', { D: { id: d.id, loading: true, justPlayed: { score: d.score, ms: d.ms, n: L.total } } });
  confetti(); beep(true);
  try {
    const a = await fbToken();
    const now = new Date();
    if (d.create) {
      await fsCall('PATCH', `duels/${d.id}`, fsDoc({ by: a.uid, byName: PLAYER.name, q: JSON.stringify(d.qs), n: d.qs.length, created: now }));
    }
    await fsCall('PATCH', `duels/${d.id}/results/${a.uid}`, fsDoc({ name: PLAYER.name, score: d.score, ms: Math.round(d.ms), at: now }));
    rememberDuel({ id: d.id, by: d.byName, at: Date.now() });
    await loadDuel(d.id);
  } catch (e) {
    S.D.loading = false; S.D.error = 'Výsledek se nepodařilo uložit. Zkontroluj internet.'; render();
  }
}
async function loadDuel(id) {
  const D = S.D;
  D.loading = true; render();
  try {
    const doc = await fsCall('GET', `duels/${id}`);
    const f = fsRead(doc.fields);
    D.byName = f.byName; D.qs = JSON.parse(f.q);
    const rows = await fsCall('POST', `duels/${id}:runQuery`, { structuredQuery: { from: [{ collectionId: 'results' }], limit: 100 } });
    D.results = (rows || []).filter(r => r.document).map(r => ({ uid: r.document.name.split('/').pop(), ...fsRead(r.document.fields) }))
      .sort((x, y) => (y.score - x.score) || (x.ms - y.ms));
    D.me = (store.get(K.auth, null) || {}).uid;
    D.played = D.results.some(r => r.uid === D.me);
    D.error = null;
  } catch (e) { D.error = /404/.test(e.message) ? 'Tahle výzva neexistuje.' : 'Výzvu se nepodařilo načíst. Zkontroluj internet.'; }
  D.loading = false;
  if (S.screen === 'duel') render();
}
function openDuel(id) { go('duel', { D: { id, loading: true } }); loadDuel(id); }
function playDuel() {
  if (!PLAYER) { go('board', { B: { tab: 'week', after: 'duel:' + S.D.id } }); return; }
  startDuelGame({ id: S.D.id, create: false, qs: S.D.qs, byName: S.D.byName });
}
function shareDuel() {
  const D = S.D, me = (D.results || []).find(r => r.uid === D.me);
  const txt = me ? `Vyzývám tě! Poznal/a jsem ${me.score} z ${D.qs.length} zvířat za ${fmtTime(me.ms)}. Porazíš mě? ⚔️🦊` : 'Vyzývám tě na souboj v poznávání zvířat! ⚔️🦊';
  shareApp(`${appUrl()}?duel=${D.id}`, txt);
}
async function openDuels() {
  go('duels', { L2: { list: myDuels(), res: {} } });
  const me = (store.get(K.auth, null) || {}).uid;
  for (const d of myDuels().slice(0, 8)) {
    try {
      const rows = await fsCall('POST', `duels/${d.id}:runQuery`, { structuredQuery: { from: [{ collectionId: 'results' }], limit: 100 } });
      const rs = (rows || []).filter(r => r.document).map(r => ({ uid: r.document.name.split('/').pop(), ...fsRead(r.document.fields) }))
        .sort((x, y) => (y.score - x.score) || (x.ms - y.ms));
      if (S.screen !== 'duels') return;
      S.L2.res[d.id] = { n: rs.length, rank: rs.findIndex(r => r.uid === me) + 1, leader: rs[0] };
      render();
    } catch (e) { /* offline: keep the plain list */ }
  }
}

/* ------------------------------------------------------------------ *
 *  First-run welcome: install to home screen (so progress persists),  *
 *  then pick a nickname. On iPhone the home-screen app has its own    *
 *  storage, so the nickname is chosen inside the installed app.       *
 * ------------------------------------------------------------------ */
const UA = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(UA);
const inAppBrowser = /Instagram|FBAN|FBAV|Messenger|Snapchat|TikTok|musical_ly|Line\//i.test(UA);
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (S.screen === 'onboard') render(); });
window.addEventListener('appinstalled', () => { installPrompt = null; if (S.screen === 'onboard' && S.O.steps[S.O.i] === 'install') onboardNext(); });

function startOnboarding(after) {
  const steps = ['welcome'];
  if (!isStandalone() && (isIOS || isAndroid)) steps.push('install');
  if (!PLAYER) steps.push('nick');
  go('onboard', { O: { steps, i: 0, after } });
}
function onboardNext() {
  const O = S.O;
  if (O.i + 1 < O.steps.length) { O.i++; O.error = null; render(); window.scrollTo(0, 0); return; }
  store.set(K.onboarded, true);
  if (O.after) openDuel(O.after); else go('home');
}
async function onboardNick(name) {
  S.O.saving = true; S.O.error = null; render();
  try {
    PLAYER = { name };
    await syncPlayer();
    store.set(K.player, PLAYER);
    S.O.saving = false;
    onboardNext();
  } catch (e) {
    PLAYER = null;
    S.O.saving = false; S.O.error = /403/.test(e.message) ? NICK_REFUSED : 'Nepovedlo se připojit. Zkontroluj internet, nebo to přeskoč a nastav později v Žebříčku.'; render();
  }
}

/* ------------------------------------------------------------------ *
 *  Events                                                             *
 * ------------------------------------------------------------------ */
$app.addEventListener('click', e => {
  const sayBtn = e.target.closest('[data-say]');
  if (sayBtn) { e.stopPropagation(); say(sayBtn.dataset.say, sayBtn.dataset.lang); return; }

  const g = e.target.closest('[data-group]');
  if (g) {
    const id = g.dataset.group;
    SELECTED = SELECTED.includes(id) ? SELECTED.filter(x => x !== id) : [...SELECTED, id];
    store.set(K.sel, SELECTED); render(); return;
  }

  const pick = e.target.closest('[data-pick]');
  if (pick && S.screen === 'lesson') {
    const it = S.L.queue[S.L.i];
    if (it.state) return;
    const i = +pick.dataset.pick;
    let ok;
    if (it.type === 'pickName') ok = it.options[i] === it.a;
    else if (it.type === 'pickImage') ok = it.options[i].a === it.a;
    else if (it.type === 'epithet') ok = it.options[i] === it.a.second;
    answer(it, ok, { pick: i, verdict: 'ok' });
    return;
  }

  const open = e.target.closest('[data-open]');
  if (open) { EGG = false; S.open = open.dataset.open; S.openIdx = 0; render(); say(S.open); return; }

  const actEl = e.target.closest('[data-act]');
  if (!actEl) return;
  const act = actEl.dataset.act;
  if (act === 'closeModal' && e.target.closest('[data-stop]') && actEl.classList.contains('modal-bg')) return;
  switch (act) {
    case 'lesson': startLesson(); break;
    case 'exam': startExam(); break;
    case 'cards': startCards(); break;
    case 'atlas': go('atlas', { hide: store.get(K.hide, false), q: '' }); break;
    case 'home': go('home'); break;
    case 'retry': go('loading'); loadImages(true).then(() => go('home')); break;
    case 'toggleAll': SELECTED = SELECTED.length === GROUPS.length ? [] : GROUPS.map(g => g.id); store.set(K.sel, SELECTED); render(); break;
    case 'share': shareApp(); break;
    case 'onbNext': onboardNext(); break;
    case 'onbOs': S.O.os = actEl.dataset.os; render(); break;
    case 'onbInstall':
      if (installPrompt) { installPrompt.prompt(); installPrompt.userChoice.then(c => { installPrompt = null; if (c.outcome === 'accepted') onboardNext(); else render(); }).catch(() => {}); }
      break;
    case 'duels': openDuels(); break;
    case 'newDuel': newDuel(); break;
    case 'playDuel': playDuel(); break;
    case 'shareDuel': shareDuel(); break;
    case 'openDuel': openDuel(actEl.dataset.id); break;
    case 'board': go('board', { B: { tab: 'week', rows: null } }); if (PLAYER) loadBoard(); break;
    case 'tabWeek': S.B.tab = 'week'; loadBoard(); break;
    case 'tabAll': S.B.tab = 'all'; loadBoard(); break;
    case 'rename': S.B.rename = true; render(); break;
    case 'cancelRename': S.B.rename = false; render(); break;
    case 'leaveBoard': leaveBoard(); break;
    case 'sound': SOUND = !SOUND; store.set(K.sound, SOUND); render(); break;
    case 'reset':
      if (confirm('Opravdu smazat celý pokrok? Tohle nejde vrátit.')) {
        PROGRESS = {}; STATS = { xp: 0, streak: 0, lastDay: null, lessons: 0 };
        store.del(K.prog); store.del(K.stats); scheduleSync(); render();
      }
      break;
    case 'quit':
      if (S.L.done === 0 || confirm('Opravdu chceš skončit? Pokrok v této lekci se neuloží do série.')) go('home');
      break;
    case 'next': next(); break;
    case 'hint': S.L.queue[S.L.i].hint = true; render(); break;
    case 'dunno': { const it = S.L.queue[S.L.i]; answer(it, false, { typed: '', verdict: 'wrong' }); break; }
    case 'practiceMistakes': startLesson(S.L.mistakes.map(m => m.a)); break;
    case 'flip': if (!S.C.flipped) { S.C.flipped = true; render(); say(S.C.queue[S.C.i].cz); } break;
    case 'cardYes': case 'cardNo': {
      const C = S.C, ok = act === 'cardYes';
      record(C.queue[C.i], ok); if (ok) { C.yes++; addXp(1); }
      C.i++; C.flipped = false; EGG = false;
      if (C.i >= C.queue.length) { go('cardsEnd', { C }); confetti(); }
      else { C.img = pickImg(C.queue[C.i]); render(); }
      break;
    }
    case 'photoMode':
      WHOLE = !WHOLE; store.set(K.whole, WHOLE); document.body.classList.toggle('whole-photos', WHOLE);
      document.querySelectorAll('[data-act=photoMode]').forEach(b => { b.innerHTML = photoLabel(); });
      break;
    case 'hideNames': S.hide = !S.hide; store.set(K.hide, S.hide); { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case 'closeModal': EGG = false; S.open = null; { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case 'nextImg': EGG = false; S.openIdx++; { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case 'badImg': {
      const a = ANIMALS.find(x => x.id === S.open);
      const list = imgsOf(a); const url = list[Math.min(S.openIdx || 0, list.length - 1)];
      if (url && confirm('Skrýt tuto fotku? (Např. když ukazuje něco jiného než zvíře.)')) {
        BAD.add(url); store.set(K.bad, [...BAD]); S.openIdx = 0;
        const y = window.scrollY; render(); window.scrollTo(0, y);
      }
      break;
    }
  }
});

function applyAtlasSearch() {
  const q = strip(S.q || '');
  let shown = 0;
  $app.querySelectorAll('.agroup').forEach(gr => {
    let n = 0;
    gr.querySelectorAll('.acard').forEach(c => { const ok = !q || c.dataset.s.includes(q); c.hidden = !ok; if (ok) n++; });
    gr.hidden = !n; shown += n;
  });
  const empty = $app.querySelector('.search-empty'); if (empty) empty.hidden = shown > 0;
}
document.addEventListener('scroll', e => {
  const c = e.target;
  if (!c.matches || !c.matches('[data-carousel]')) return;
  const i = Math.round(c.scrollLeft / c.clientWidth);
  if (i === S.openIdx) return;
  S.openIdx = i; EGG = false;
  const nameEl = $app.querySelector('.detail .intro-name'); if (nameEl && S.open) nameEl.innerHTML = `${nameHtml(ANIMALS.find(x => x.id === S.open))} ${speakBtn(ANIMALS.find(x => x.id === S.open))}`;
  $app.querySelectorAll('.cdots i').forEach((d, k) => d.classList.toggle('on', k === i));
}, true);

$app.addEventListener('input', e => {
  if (e.target.matches('[data-search]')) { S.q = e.target.value; applyAtlasSearch(); }
});

$app.addEventListener('submit', e => {
  e.preventDefault();
  if (S.screen === 'onboard') {
    const name = cleanName(e.target.nick.value);
    if (name.length < 2) { e.target.nick.focus(); return; }
    if (badName(name)) { S.O.error = NICK_REFUSED; render(); return; }
    onboardNick(name); return;
  }
  if (S.screen === 'board') {
    const name = cleanName(e.target.nick.value);
    if (name.length < 2) { e.target.nick.focus(); return; }
    if (badName(name)) { S.B.error = NICK_REFUSED; render(); return; }
    joinBoard(name); return;
  }
  if (S.screen !== 'lesson') return;
  const it = S.L.queue[S.L.i];
  if (it.state || it.type !== 'type') return;
  const typed = e.target.ans.value;
  if (!typed.trim()) { e.target.ans.focus(); return; }
  const verdict = checkTyped(typed, it.a);
  answer(it, verdict !== 'wrong', { typed, verdict });
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (S.screen === 'lesson') {
    const it = S.L.queue[S.L.i];
    if (it.type === 'intro' || it.state) { e.preventDefault(); next(); }
  } else if (S.screen === 'cards' && !S.C.flipped) { e.preventDefault(); S.C.flipped = true; render(); }
});

/* ------------------------------------------------------------------ */
render();
loadImages(false).then(() => {
  let duelId = new URLSearchParams(location.search).get('duel');
  if (!(duelId && /^[a-z0-9]{6,24}$/.test(duelId))) duelId = null;
  if (duelId) history.replaceState(null, '', appUrl());
  if (!store.get(K.onboarded, false)) startOnboarding(duelId);
  else if (duelId) openDuel(duelId);
  else go('home');
});
</script>
</body>
